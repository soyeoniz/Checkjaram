<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<meta name="color-scheme" content="light">
<meta name="description" content="미취학부터 초등까지 추천도서, 도서관 대여 확인, 바코드 등록, 읽은 책 세기까지 한 화면에서.">
<title>책자람 — 미취학·초등 독서 기록</title>
<style>
  :root{
    --paper:#f7f4ec; --card:#fffdf9; --ink:#28261f; --muted:#7c7869; --line:#e7e1d3;
    --brand:#2e6b58; --brand-2:#3f8a6f; --brand-soft:#e8f2ed; --brand-ink:#1f4b3e;
    --accent:#ef9f4b; --accent-soft:#fdf1e2; --danger:#bf5741; --danger-soft:#fbeae6;
    --p1:#b9791f; --p1s:#fbf0dc;
    --p2:#4f7f43; --p2s:#e9f3e3;
    --p3:#3f6d9e; --p3s:#e8f0f8;
    --p4:#7a5b9e; --p4s:#f1eaf8;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --shadow:0 10px 26px rgba(40,38,31,.07);
    --shadow-sm:0 3px 10px rgba(40,38,31,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #efe8d8 0%, #e9e3d4 55%, #e4ddcc 100%);
    color:var(--ink); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:440px; margin:0 auto; min-height:100dvh; background:var(--paper);
    position:relative; display:flex; flex-direction:column;
    box-shadow:0 0 0 1px rgba(40,38,31,.05), 0 24px 60px rgba(40,38,31,.10);
  }
  .appbar{
    position:sticky; top:0; z-index:30;
    background:rgba(247,244,236,.92); backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .appbar-in{display:flex; align-items:center; gap:10px; padding:12px 16px}
  .brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1}
  .brand-mark{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(145deg,#fff6e6,#f6e3c2); border:1px solid #efdfc4; flex:none;
  }
  .brand-name{font-size:17px; font-weight:800; letter-spacing:-.02em; line-height:1.2}
  .brand-sub{font-size:11.5px; color:var(--muted); letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .icon-btn{
    width:42px;height:42px;border-radius:13px;border:1px solid var(--line); background:#fffdf9;
    display:grid;place-items:center; color:var(--ink); cursor:pointer; flex:none;
  }
  .icon-btn:active{transform:scale(.96)}
  .main{flex:1 0 auto; padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  .pad{padding:16px 16px 8px}
  .h1{font-size:21px; font-weight:800; letter-spacing:-.03em; margin:2px 0 4px}
  .sub{font-size:13px; color:var(--muted); margin:0 0 14px; letter-spacing:-.01em}
  .section-title{font-size:14px; font-weight:700; letter-spacing:-.02em; margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .section-title .aside{font-size:12px; font-weight:500; color:var(--muted)}

  /* search + chips */
  .searchbox{position:relative; margin-bottom:10px}
  .searchbox input{
    width:100%; height:46px; border-radius:14px; border:1px solid var(--line); background:#fffdf9;
    padding:0 14px 0 40px; font-size:15px; color:var(--ink); outline:none;
    font-family:inherit;
  }
  .searchbox input:focus{border-color:var(--brand-2); box-shadow:0 0 0 3px rgba(63,138,111,.12)}
  .searchbox .ico{position:absolute; left:13px; top:13px; font-size:16px; opacity:.5}
  .chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; border:1px solid var(--line); background:#fffdf9; color:var(--muted);
    border-radius:999px; padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer;
    letter-spacing:-.01em; font-family:inherit;
  }
  .chip.is-on{background:var(--ink); border-color:var(--ink); color:#fff}
  .list-head{display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 10px; font-size:12.5px; color:var(--muted)}
  .list-head b{color:var(--brand); font-weight:800}
  .group-head{display:flex; align-items:baseline; justify-content:space-between; margin:20px 2px 8px; padding-bottom:6px; border-bottom:1px solid rgba(0,0,0,.08); font-size:13.5px; font-weight:800; color:#333}
  .group-head em{font-style:normal; font-size:12px; font-weight:600; color:var(--muted)}
  .group-head:first-child{margin-top:4px}

  /* book card */
  .book{
    display:flex; gap:12px; padding:13px; background:var(--card); border:1px solid var(--line);
    border-radius:18px; margin-bottom:10px; box-shadow:var(--shadow-sm);
  }
  .book.is-read{background:linear-gradient(180deg,#f6fbf7,#fffdf9); border-color:#d5e7db}
  .cover{
    width:62px; height:86px; border-radius:9px; flex:none; display:grid; place-items:center;
    background:linear-gradient(150deg,var(--cs1,#fde8c8),var(--cs2,#f7c78b));
    font-size:27px; box-shadow:inset -7px 0 0 rgba(0,0,0,.05), 0 4px 10px rgba(40,38,31,.10);
    position:relative; overflow:hidden;
  }
  .cover::after{content:""; position:absolute; left:5px; top:0; bottom:0; width:1px; background:rgba(255,255,255,.5)}
  .book-main{min-width:0; flex:1}
  .book-top{display:flex; align-items:flex-start; gap:8px; justify-content:space-between}
  .book-title{font-size:15.5px; font-weight:800; letter-spacing:-.03em; margin:0; line-height:1.3}
  .band{font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:6px; flex:none; letter-spacing:-.01em}
  .band-p1{background:var(--p1s); color:var(--p1)}
  .band-p2{background:var(--p2s); color:var(--p2)}
  .band-p3{background:var(--p3s); color:var(--p3)}
  .band-p4{background:var(--p4s); color:var(--p4)}
  .band-p0{background:#f0ede4; color:#6f6a5c}
  .book-meta{font-size:12px; color:var(--muted); margin:2px 0 6px; letter-spacing:-.01em}
  .book-why{font-size:12.8px; color:#4c483e; margin:0 0 6px; line-height:1.55; letter-spacing:-.01em}
  .book-why.clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .more{background:none;border:0;padding:0 0 6px;color:var(--brand-2);font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .book-tags{font-size:11.5px; color:var(--brand-2); margin:0 0 9px; font-weight:600; letter-spacing:-.01em}
  .book-actions{display:flex; gap:6px; flex-wrap:wrap}
  .isbn{font-size:11px; color:#a09a8b; margin:8px 0 0; letter-spacing:.02em}

  .btn{
    border:1px solid transparent; background:#fff; color:var(--ink); font-family:inherit;
    font-size:14px; font-weight:700; letter-spacing:-.02em; border-radius:12px; padding:12px 14px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .btn:active{transform:scale(.985)}
  .btn-xs{font-size:12.5px; padding:8px 10px; border-radius:10px; font-weight:700}
  .btn-primary{background:var(--brand); color:#fff; box-shadow:0 6px 16px rgba(46,107,88,.22)}
  .btn-ghost{background:#fffdf9; border-color:var(--line); color:#4c483e}
  .btn-soft{background:var(--brand-soft); color:var(--brand-ink); border-color:#d8e9e0}
  .btn-accent{background:var(--accent-soft); color:#96601f; border-color:#f4dfc2}
  .btn-on{background:var(--brand); color:#fff; border-color:var(--brand)}
  .btn-danger{background:var(--danger-soft); color:var(--danger); border-color:#f2d5cd}
  .btn-full{width:100%}
  .btn[disabled]{opacity:.55; cursor:default}

  .note{font-size:11.5px; color:#96907f; line-height:1.6; margin:14px 2px 0; letter-spacing:-.01em}

  /* cards & forms */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px; margin-bottom:12px; box-shadow:var(--shadow-sm)}
  .card-title{font-size:13px; font-weight:800; letter-spacing:-.02em; margin:0 0 10px; display:flex; align-items:center; gap:6px}
  .field{margin-bottom:11px}
  .label{display:block; font-size:12px; font-weight:700; color:#6b6657; margin-bottom:5px; letter-spacing:-.01em}
  .input,.select,textarea.input{
    width:100%; height:44px; border-radius:12px; border:1px solid var(--line); background:#fffdf9;
    padding:0 12px; font-size:14.5px; color:var(--ink); font-family:inherit; outline:none;
  }
  textarea.input{height:auto; min-height:96px; padding:11px 12px; line-height:1.55; resize:vertical}
  .input:focus,.select:focus,textarea.input:focus{border-color:var(--brand-2); box-shadow:0 0 0 3px rgba(63,138,111,.12)}
  .row2{display:flex; gap:8px}
  .row2 > *{flex:1; min-width:0}
  .btns{display:flex; gap:8px; margin-top:4px}
  .btns > .btn{flex:1}
  .hint{font-size:11.5px; color:#96907f; margin:9px 0 0; line-height:1.55; letter-spacing:-.01em}
  .hint a{color:var(--brand-2); text-decoration:none; font-weight:700}

  /* library results */
  .demo-banner{
    display:flex; gap:8px; align-items:flex-start; background:var(--accent-soft); border:1px dashed #eccfa6;
    color:#8a5a1d; border-radius:14px; padding:11px 12px; font-size:12.3px; line-height:1.5; margin-bottom:10px;
  }
  .libitem{border:1px solid var(--line); border-radius:14px; padding:12px; background:#fffdf9; margin-bottom:8px}
  .lib-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px}
  .lib-name{font-size:14px; font-weight:800; letter-spacing:-.02em}
  .badge{font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:6px; flex:none; letter-spacing:-.01em}
  .badge-ok{background:#e4f3e8; color:#2f7a45}
  .badge-out{background:#fbeae6; color:#b2503a}
  .badge-q{background:#f1efe7; color:#78715f}
  .lib-meta{font-size:11.8px; color:var(--muted); line-height:1.5; letter-spacing:-.01em}
  .lib-meta a{color:var(--brand-2); text-decoration:none; font-weight:700}
  .lib-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
  .error-card{background:var(--danger-soft); border:1px solid #f0d3cb; color:#98402c; border-radius:14px; padding:12px; font-size:12.8px; line-height:1.55}
  .error-card b{display:block; margin-bottom:4px}
  .empty{text-align:center; padding:36px 16px; color:var(--muted); font-size:13.5px}
  .empty .em{font-size:30px; display:block; margin-bottom:8px}

  /* stats */
  .stat-hero{background:linear-gradient(160deg,#2e6b58,#245245); color:#fff; border-radius:22px; padding:18px; display:flex; align-items:center; gap:16px; box-shadow:0 12px 28px rgba(36,82,69,.25); margin-bottom:12px}
  .ring{width:96px; height:96px; flex:none; transform:rotate(-90deg)}
  .ring-bg{fill:none; stroke:rgba(255,255,255,.22); stroke-width:10}
  .ring-fg{fill:none; stroke:#f6d38b; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .5s ease}
  .ring-wrap{position:relative; width:96px; height:96px; flex:none}
  .ring-num{position:absolute; inset:0; display:grid; place-items:center; font-size:20px; font-weight:800; letter-spacing:-.03em}
  .ring-num small{font-size:11px; font-weight:700; opacity:.8; display:block; text-align:center; margin-top:-2px}
  .hero-text{min-width:0}
  .hero-text .big{font-size:15px; font-weight:700; letter-spacing:-.02em; opacity:.9}
  .hero-text .num{font-size:30px; font-weight:800; letter-spacing:-.04em; line-height:1.15}
  .hero-text .num small{font-size:14px; font-weight:700; opacity:.8}
  .hero-text .goal{font-size:12px; opacity:.85; margin-top:4px; letter-spacing:-.01em}
  .quick-btns{display:flex; gap:7px; margin-top:12px}
  .quick-btns .btn{flex:1; background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.22); font-size:12.5px; padding:9px 8px; white-space:nowrap}

  .bar-row{margin-bottom:10px}
  .bar-top{display:flex; justify-content:space-between; font-size:12.3px; margin-bottom:5px; letter-spacing:-.01em}
  .bar-top .n{font-weight:800; color:var(--ink)}
  .bar{height:9px; background:#eee8da; border-radius:999px; overflow:hidden}
  .bar > i{display:block; height:100%; border-radius:999px; transition:width .4s ease}
  .bar-p1{background:linear-gradient(90deg,#e0a546,#c98a2c)}
  .bar-p2{background:linear-gradient(90deg,#6aa95b,#4f7f43)}
  .bar-p3{background:linear-gradient(90deg,#5e8dbf,#3f6d9e)}
  .bar-p4{background:linear-gradient(90deg,#9a79bd,#7a5b9e)}
  .bar-p0{background:linear-gradient(90deg,#a9a395,#8b8577)}

  .logitem{border:1px solid var(--line); border-radius:14px; padding:11px 12px; background:#fffdf9; margin-bottom:8px}
  .log-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .log-title{font-size:13.5px; font-weight:800; letter-spacing:-.02em}
  .log-date{font-size:11px; color:#a09a8b; flex:none}
  .log-type{font-size:11.5px; color:var(--brand-2); font-weight:700; margin-top:2px}
  .log-memo{font-size:12.5px; color:#4c483e; margin-top:5px; line-height:1.55; white-space:pre-wrap; letter-spacing:-.01em}
  .stars{display:flex; gap:2px; font-size:14px; margin-top:4px; color:#dcd5c5}
  .star{background:none; border:0; padding:0 1px; font-size:19px; line-height:1; cursor:pointer; color:#ddd6c6; font-family:inherit}
  .star.is-on{color:#e8a33c}
  .log-del{background:none;border:0;color:#a09a8b;font-size:11.5px;cursor:pointer;font-family:inherit;padding:2px 0}

  /* tabs */
  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:440px; z-index:40;
    display:flex; background:rgba(255,253,249,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1; background:none; border:0; font-family:inherit; cursor:pointer; color:#9a9484;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 4px; border-radius:12px;
  }
  .tab-btn .tab-ico{width:23px; height:23px; display:block}
  .tab-btn .tab-label{font-size:10.5px; font-weight:700; letter-spacing:-.01em}
  .tab-btn.is-active{color:var(--brand)}
  .tab-btn.is-active .tab-ico{transform:translateY(-1px)}

  /* sheet */
  .backdrop{position:fixed; inset:0; background:rgba(28,26,22,.42); z-index:50; opacity:0; transition:opacity .2s ease}
  .backdrop.is-open{opacity:1}
  .sheet{
    position:fixed; left:50%; bottom:0; transform:translate(-50%,102%); width:100%; max-width:440px; z-index:60;
    background:var(--paper); border-radius:22px 22px 0 0; max-height:90dvh; overflow:auto;
    transition:transform .26s cubic-bezier(.2,.8,.3,1); padding-bottom:calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -14px 40px rgba(28,26,22,.25);
  }
  .sheet.is-open{transform:translate(-50%,0)}
  .sheet-head{position:sticky; top:0; background:var(--paper); padding:16px 18px 10px; display:flex; align-items:flex-start; gap:10px; border-bottom:1px solid var(--line); z-index:2}
  .sheet-head h2{font-size:17px; font-weight:800; letter-spacing:-.03em; margin:0; flex:1; line-height:1.35}
  .sheet-head .sheet-sub{font-size:12px; color:var(--muted); margin-top:3px; font-weight:500}
  .sheet-close{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fffdf9;font-size:16px;cursor:pointer;flex:none;color:#6b6657}
  .sheet-body{padding:16px 18px}
  .act{border:1px solid var(--line); border-radius:14px; padding:12px; background:#fffdf9; margin-bottom:9px}
  .act-head{display:flex; align-items:center; gap:7px; margin-bottom:5px}
  .act-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);font-size:13px;flex:none}
  .act-type{font-size:11px; font-weight:800; color:var(--brand); letter-spacing:-.01em}
  .act-title{font-size:13.5px; font-weight:800; letter-spacing:-.02em; margin:0 0 4px}
  .act-prompt{font-size:12.5px; color:#4c483e; margin:0; line-height:1.55; letter-spacing:-.01em}
  .divider{height:1px; background:var(--line); margin:16px 0}
  .type-chips{display:flex; gap:6px; flex-wrap:wrap}
  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translate(-50%,8px);
    background:#28261f; color:#fff; font-size:13px; font-weight:600; padding:10px 16px; border-radius:999px;
    z-index:80; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; max-width:90%;
    text-align:center; letter-spacing:-.01em;
  }
  .toast.is-on{opacity:1; transform:translate(-50%,0)}
  body.sheet-open .toast{bottom:auto; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%,-8px)}
  body.sheet-open .toast.is-on{transform:translate(-50%,0)}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

  /* scan */
  .scan-frame{border-radius:16px; overflow:hidden; background:#1f1d19; min-height:180px; display:grid; place-items:center; color:#cfc9bb; font-size:12.5px; text-align:center; padding:16px}
  #reader{width:100%}
  #reader video{width:100%!important; border-radius:12px}
  .scan-mock{display:grid; place-items:center; gap:8px}
  .scan-mock svg{width:78%; max-width:240px; height:auto; opacity:.9}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important; animation:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="appbar-in">
      <div class="brand">
        <span class="brand-mark">📚</span>
        <div style="min-width:0">
          <div class="brand-name">책자람</div>
          <div class="brand-sub" id="brandSub">미취학·초등 독서 기록</div>
        </div>
      </div>
      <button class="icon-btn" id="btnSettings" data-act="openSettings" aria-label="설정">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.96 4.6 1.7 1.7 0 0 0 10 3.04V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="main" id="main">
    <section id="tab-books" aria-label="추천도서"></section>
    <section id="tab-library" aria-label="도서관 대여 확인"></section>
    <section id="tab-scan" aria-label="바코드 등록"></section>
    <section id="tab-shelf" aria-label="내 책장"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="주요 메뉴">
    <button class="tab-btn is-active" data-tab="books" role="tab" aria-selected="true">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

  function freshState() {
    return {
      v: 1,
      profile: { name: '', goal: 40 },
      reading: {},
      logs: [],
      custom: [],
      settings: { apiKey: '', kakaoKey: '', region: '21', dtlRegion: '' },

    };
  }

  function loadState() {
    var s = freshState();
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return s;
      var saved = JSON.parse(raw);
      if (!saved || typeof saved !== 'object') return s;
      s.profile = Object.assign(s.profile, saved.profile || {});
      s.reading = saved.reading || {};
      s.logs = Array.isArray(saved.logs) ? saved.logs : [];
      s.custom = Array.isArray(saved.custom) ? saved.custom : [];
      s.settings = Object.assign(s.settings, saved.settings || {});
      s.ui = Object.assign(s.ui, saved.ui || {});
      return s;
    } catch (e) {
      return s;
    }
  }

  var state = loadState();

  function saveState() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 무시 */ }
  }

      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1); if (m.length < 2) m = '0' + m;
    var day = String(d.getDate()); if (day.length < 2) day = '0' + day;
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function thisMonth() { return todayISO().slice(0, 7); }

  function fmtDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    if (p.length < 3) return iso;
    return p[0] + '.' + p[1] + '.' + p[2];
  }

  function uid(prefix) {
    return (prefix || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function digitsOnly(s) { return String(s || '').replace(/[^0-9Xx]/g, '').toUpperCase(); }

  // ISBN-13 체크 디지트 검사
  function isValidISBN13(code) {
    var s = digitsOnly(code);
    if (s.length !== 13) return false;
    var sum = 0;
    for (var i = 0; i < 12; i++) {
      var d = parseInt(s.charAt(i), 10);
      if (isNaN(d)) return false;
      sum += d * (i % 2 === 0 ? 1 : 3);
    }
    var check = (10 - (sum % 10)) % 10;
    return check === parseInt(s.charAt(12), 10);
  }

  function isBookBarcode(code) {
    var s = digitsOnly(code);
    return s.length === 13 && (s.indexOf('978') === 0 || s.indexOf('979') === 0) && isValidISBN13(s);
  }

  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function coverStyle(book) {
    var idx = 0;
    for (var i = 0; i < BOOKS.length; i++) { if (BOOKS[i].id === book.id) { idx = i; break; } }
    if (book.band === 'etc') idx = idx + 3;
    var pair = COVER_COLORS[idx % COVER_COLORS.length];
    return '--cs1:' + pair[0] + ';--cs2:' + pair[1];
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('is-on');
    if (toast._t) clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('is-on'); }, 2100);
  }

  var transientBook = null;

  function allBooks() {
    return BOOKS.concat(state.custom || []);
  }

  function getBook(id) {
    var list = allBooks();
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    if (transientBook && transientBook.id === id) return transientBook;
    return null;
  }

  function selectableBooks() {
    var list = allBooks();
    if (transientBook) {
      var exists = false;
      for (var i = 0; i < list.length; i++) { if (list[i].id === transientBook.id) exists = true; }
      if (!exists) list = list.concat([transientBook]);
    }
    return list;
  }

  function isRead(id) {
    var r = state.reading[id];
    return !!(r && r.done);
  }

  function filterBooks() {
    var q = (state.ui.q || '').trim().toLowerCase();
    var band = state.ui.band || 'all';
    return allBooks().filter(function (b) {
      if (band !== 'all' && b.band !== band) return false;
      if (!q) return true;
      var hay = (b.title + ' ' + b.author + ' ' + b.publisher + ' ' + (b.isbn || '') + ' ' + (b.tags || []).join(' ')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function computeStats() {
    var done = allBooks().filter(function (b) { return isRead(b.id); });
    var byBand = { preschool: 0, low: 0, mid: 0, high: 0, etc: 0 };
    var month = 0;
    for (var i = 0; i < done.length; i++) {
      var b = done[i];
      var k = byBand[b.band] === undefined ? 'etc' : b.band;
      byBand[k] = (byBand[k] || 0) + 1;
      var r = state.reading[b.id];
      if (r && r.finishedAt && r.finishedAt.slice(0, 7) === thisMonth()) month++;
    }
    var goal = parseInt(state.profile.goal, 10);
    if (isNaN(goal) || goal < 0) goal = 0;
    var total = done.length;
    var pct = goal > 0 ? Math.min(100, Math.round((total / goal) * 100)) : 0;
    return {
      total: total, byBand: byBand, thisMonth: month, goal: goal, pct: pct,
      remaining: goal > total ? goal - total : 0,
      readIds: done.map(function (b) { return b.id; })
    };
  }

  function logsFor(bookId) {
    return (state.logs || []).filter(function (l) { return l.bookId === bookId; });

  /* --- 응답 파싱(중첩 구조가 달라도 견디도록 재귀 탐색) --- */
  function collectObjects(node, out, depth) {
    if (!node || typeof node !== 'object' || depth > 8) return out;
    if (Array.isArray(node)) {
      for (var i = 0; i < node.length; i++) collectObjects(node[i], out, depth + 1);
      return out;
    }
    out.push(node);
    for (var k in node) {
      if (Object.prototype.hasOwnProperty.call(node, k)) collectObjects(node[k], out, depth + 1);
    }
    return out;
  }

  function pickField(obj, names) {
    for (var i = 0; i < names.length; i++) {
      if (obj[names[i]] !== undefined && obj[names[i]] !== null && obj[names[i]] !== '') return obj[names[i]];
    }
    return '';
  }

  function parseLibsByBook(json) {
    var objs = collectObjects(json, [], 0);
    var libs = [];
    var seen = {};
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      var name = pickField(o, ['libName', 'libname', 'libraryName']);
      if (!name) continue;
      var code = String(pickField(o, ['libCode', 'libcode', 'libraryCode']) || name);
      if (seen[code]) continue;
      seen[code] = true;
      libs.push({
        code: code,
        name: String(name),
        address: String(pickField(o, ['address', 'addr', 'libAddress'])),
        tel: String(pickField(o, ['tel', 'phone', 'libTel'])),
        homepage: String(pickField(o, ['homepage', 'homePage', 'libHomepage'])),
        closed: String(pickField(o, ['closed', 'closeDay', 'closedDay'])),
        hours: String(pickField(o, ['operatingTime', 'openingTime', 'openTime'])),
        lat: String(pickField(o, ['latitude', 'lat'])),
        lng: String(pickField(o, ['longitude', 'lng']))
      });
    }
    return libs;
  }

  function parseBookExist(json) {
    var objs = collectObjects(json, [], 0);
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      if (o.hasBook !== undefined || o.loanAvailable !== undefined) {
        var calls = [];
        var cn = o.callNumbers || o.callNumber;
        if (Array.isArray(cn)) {
          for (var j = 0; j < cn.length; j++) {
            var c = cn[j];
            if (typeof c === 'string') calls.push(c);
            else if (c && c.callNumber) calls.push(String(c.callNumber));
          }
        } else if (typeof cn === 'string' && cn) {
          calls.push(cn);
        }
        return {
          hasBook: String(o.hasBook || '') === 'Y',
          loanAvailable: String(o.loanAvailable || '') === 'Y',
          callNumbers: calls
        };
      }
    }
    return null;
  }

  function stripTags(s) { return String(s || '').replace(/<[^>]*>/g, '').trim(); }

  function parseKakao(json) {
    if (!json || !json.documents || !json.documents.length) return null;
    var d = json.documents[0];
    var title = stripTags(d.title);
    if (!title) return null;
    var isbn13 = '';
    var parts = String(d.isbn || '').split(' ');
    for (var i = 0; i < parts.length; i++) { if (parts[i].replace(/[^0-9]/g, '').length === 13) isbn13 = parts[i].replace(/[^0-9]/g, ''); }
    return {
      title: title,
      author: (d.authors || []).join(', '),
      publisher: d.publisher || '',
      year: String(d.datetime || '').slice(0, 4),
      isbn: isbn13,
      source: '카카오 책 검색'
    };
  }

  function parseGoogleBooks(json) {
    if (!json || !json.items || !json.items.length) return null;
    var v = json.items[0].volumeInfo || {};
    if (!v.title) return null;
    return {
      title: v.title + (v.subtitle ? ' ' + v.subtitle : ''),
      author: (v.authors || []).join(', '),
      publisher: v.publisher || '',
      year: (v.publishedDate || '').slice(0, 4),
      source: 'Google Books'
    };
  }

  function parseOpenLibrary(json) {
    if (!json || !json.title) return null;
    var pub = json.publishers && json.publishers.length ? json.publishers[0] : '';
    if (pub && typeof pub === 'object') pub = pub.name || '';
    return {
      title: json.title + (json.subtitle ? ' ' + json.subtitle : ''),
      author: '',
      publisher: pub,
      year: String(json.publish_date || '').match(/\d{4}/) ? String(json.publish_date).match(/\d{4}/)[0] : '',
      source: 'Open Library'
    };
  }

  function demoScreen(book) {

  var sheetCtx = { type: '', bookId: '', rating: 0, actType: 'talk' };

  function openSheet(html) {
    var sheet = document.getElementById('sheet');
    var back = document.getElementById('backdrop');
    if (!sheet || !back) return;
    sheet.innerHTML = html;
    try { sheet.scrollTop = 0; } catch (e0) { /* 무시 */ }
    sheet.hidden = false;
    back.hidden = false;
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(function () {
        sheet.classList.add('is-open');
        back.classList.add('is-open');
      });
    } else {
      sheet.classList.add('is-open');
      back.classList.add('is-open');
    }
    document.body.classList.add('sheet-open');
  }

  function closeSheet() {
    var sheet = document.getElementById('sheet');
    var back = document.getElementById('backdrop');
    if (!sheet || !back) return;
    sheet.classList.remove('is-open');
    back.classList.remove('is-open');
    document.body.classList.remove('sheet-open');
    var done = function () { if (!sheet.classList.contains('is-open')) { sheet.hidden = true; back.hidden = true; sheet.innerHTML = ''; } };
    setTimeout(done, 260);
  }

  function openActivity(bookId) {
    var b = getBook(bookId);
    if (!b) return;
    var r = state.reading[bookId] || {};

  function toggleRead(id, opts) {
    var b = getBook(id);
    if (!b) return;
    var cur = state.reading[id] || {};
    if (cur.done) {
      cur.done = false;
      delete cur.finishedAt;
    } else {
      cur.done = true;
      cur.finishedAt = todayISO();
    }
    state.reading[id] = cur;
    saveState();
    var label = cur.done ? '읽은 책으로 표시했어요' : '읽음 표시를 풀었어요';
    if (!opts || !opts.silent) toast(label);

  function saveLog(bookId, payload) {
    var b = getBook(bookId);
    if (!b) return;
    var date = todayISO();
    var memo = (payload.memo || '').trim();
    var type = payload.type || 'talk';
    var rating = payload.rating || 0;
    var existing = null;
    for (var i = 0; i < state.logs.length; i++) {
      var l = state.logs[i];
      if (l.bookId === bookId && l.date === date) existing = l;
    }
    var log;
    if (existing) {
      existing.type = type;
      existing.rating = rating;
      existing.memo = memo;
      log = existing;
    } else {
      log = {
        id: uid('log'), bookId: bookId, title: b.title,
        type: type, rating: rating, memo: memo, date: date
      };
      state.logs.push(log);
    }
    var r = state.reading[bookId] || {};
    if (rating) r.rating = rating;
    if (!r.done) { r.done = true; r.finishedAt = date; }
    state.reading[bookId] = r;
    saveState();
    return log;
  }

  async function lookupHolding() {
    var book = currentLibBook();

    holdingView = { mode: 'live', bookId: book.id, rows: [], error: '', loading: true, sub: '' };
    renderHoldingResultFromState();
    try {
      var res = await fetch(lookupUrl(book.isbn), { cache: 'no-store' });
      var json = await res.json();
      var err = apiErrMessage(json);
      if (err) { throw new Error(err); }
      var libs = parseLibsByBook(json);
      var rows = libs.slice(0, 30).map(function (l) { return { lib: l, checked: false, hasBook: false, loanAvailable: false, calls: [] }; });
      holdingView.rows = rows;

      renderHoldingResultFromState();

      // 상위 6곳의 대출 가능 여부를 차례로 확인
      var limit = Math.min(6, rows.length);
      for (var i = 0; i < limit; i++) {
        try {
          var r2 = await fetch(existUrl(rows[i].lib.code, book.isbn), { cache: 'no-store' });
          var j2 = await r2.json();
          var info = parseBookExist(j2);
          if (info) {
            rows[i].checked = true;
            rows[i].hasBook = info.hasBook;
            rows[i].loanAvailable = info.loanAvailable;
            rows[i].calls = info.callNumbers;
            renderHoldingResultFromState();
          }
        } catch (e2) { /* 한 곳 실패는 넘어감 */ }
      }
    } catch (e) {
      holdingView.loading = false;
      holdingView.mode = 'live';
      holdingView.error = (e && e.message ? e.message : '네트워크 오류') + ' 정보나루에서 직접 검색해 보세요.';
      renderHoldingResultFromState();
    }
  }

  /* --- ISBN 서지 조회 --- */

  async function lookupIsbn(rawIsbn) {
    var isbn = digitsOnly(rawIsbn);
    scanView.isbn = isbn;
    scanView.found = null;
    scanView.error = '';
    if (!isbn) { scanView.error = 'ISBN을 입력해 주세요.'; renderScan(); return null; }
    if (isbn.length === 10) {
      // ISBN-10 → 13 변환
      var body = '978' + isbn.slice(0, 9);
      var sum = 0;
      for (var i = 0; i < 12; i++) sum += parseInt(body.charAt(i), 10) * (i % 2 === 0 ? 1 : 3);
      isbn = body + String((10 - (sum % 10)) % 10);
      scanView.isbn = isbn;
    }
    if (!isValidISBN13(isbn)) { scanView.error = 'ISBN-13 체크 숫자가 맞지 않아요. 바코드를 다시 확인해 주세요.'; renderScan(); return null; }
    scanView.busy = true; renderScan();

    var found = null;

    // 0) 카카오 책 검색 (키가 있을 때, 한국 도서 커버리지가 좋음)
    var kk = (state.settings.kakaoKey || '').trim();
    if (kk) {
      try {
        var kr = await fetch('https://dapi.kakao.com/v3/search/book?target=isbn&query=' + isbn, {
          cache: 'no-store', headers: { Authorization: 'KakaoAK ' + kk }
        });
        if (kr.ok) {
          var kj = await kr.json();
          found = parseKakao(kj);
          if (found && !found.isbn) found.isbn = isbn;
        }
      } catch (e0) { /* 다음 경로 */ }
    }

    // 1) Google Books
    if (!found) {
      try {
        var g = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn + '&country=KR', { cache: 'no-store' });
        if (g.ok) {
          var gj = await g.json();
          found = parseGoogleBooks(gj);
          if (found) found.isbn = isbn;
        }
      } catch (e) { /* 다음 경로 */ }
    }

    // 2) 도서관 정보나루 도서 상세 (키가 있을 때만)
    if (!found && (state.settings.apiKey || '').trim()) {
      try {
        var n = await fetch('https://data4library.kr/api/srchDtlList?authKey=' + encodeURIComponent(state.settings.apiKey.trim()) +
          '&isbn13=' + isbn + '&format=json', { cache: 'no-store' });
        var nj = await n.json();
        var objs = collectObjects(nj, [], 0);
        for (var k = 0; k < objs.length; k++) {
          if (objs[k].bookname) {
            found = {
              title: String(objs[k].bookname),
              author: String(objs[k].authors || ''),
              publisher: String(objs[k].publisher || ''),
              year: String(objs[k].publication_year || ''),
              isbn: isbn,
              source: '도서관 정보나루'
            };
            break;
          }
        }
      } catch (e2) { /* 다음 경로 */ }
    }

    // 3) Open Library
    if (!found) {
      try {
        var o = await fetch('https://openlibrary.org/isbn/' + isbn + '.json', { cache: 'no-store' });
        if (o.ok) {
          var oj = await o.json();
          found = parseOpenLibrary(oj);
          if (found) found.isbn = isbn;
        }
      } catch (e3) { /* 실패 */ }
    }

    scanView.busy = false;
    if (found) {
      found.band = guessBand(found.title);
      scanView.found = found;
      scanView.error = '';
    } else {
      scanView.error = 'ISBN ' + isbn + ' 의 서지 정보를 찾지 못했어요.';
    }
    renderScan();
    return found;
  }

      var a = document.createElement('a');
      a.href = url;
      a.download = '책자람-독서기록-' + todayISO() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      toast('기록 파일을 내려받았어요');
    } catch (e) {
      toast('이 브라우저에서는 내보내기를 지원하지 않아요');

    return JSON.stringify(state);

  function resetAll() {
    var ok = true;
    if (typeof window.confirm === 'function') ok = window.confirm('읽은 책, 독후기록, 등록한 책을 모두 지울까요? 되돌릴 수 없어요.');
    if (!ok) return false;
    state = freshState();
    try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* 무시 */ }
    saveState();
    closeSheet();
    setTab('shelf');
    toast('기록을 지웠어요');
    return true;
  }

  /* --- 외부 링크 --- */

  function openNewWindow(url) {
    if (typeof window.open === 'function') {
      var w = window.open(url, '_blank', 'noopener');
      if (w) return;
    }
    toast('팝업이 막혔어요. 브라우저 설정을 확인해 주세요');
  }

  function naruUrl() {
    var b = currentLibBook() || scanView.found;
    var q = b ? (b.title || b.isbn || '') : '';
    return 'https://www.data4library.kr/srch?srchText=' + encodeURIComponent(q);
  }

  function copyTitle() {
    var b = currentLibBook();
    var text = b ? b.title : '';
    if (!text) { toast('책을 먼저 골라 주세요'); return; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        toast('책 제목을 복사했어요');
        return;
      }
    } catch (e) { /* fallback */ }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('책 제목을 복사했어요');
    } catch (e2) {
      toast('복사하지 못했어요: ' + text);
    }
  }

  /* --- 바코드 스캔 --- */

  async function startScan() {
    if (!window.Html5Qrcode) {
      scanView.status = 'error';
      scanView.message = '스캔 라이브러리를 불러오지 못했어요(인터넷 연결 확인). 아래 ISBN 직접 입력을 이용해 주세요.';
      updateScanChrome();
      return;
    }
    try {
      if (!scanner) {
        scanner = new window.Html5Qrcode('reader', {
          formatsToSupport: window.Html5QrcodeSupportedFormats
            ? [window.Html5QrcodeSupportedFormats.EAN_13, window.Html5QrcodeSupportedFormats.EAN_8]
            : undefined,
          verbose: false
        });
      }
      var reader = document.getElementById('reader');
      if (reader) reader.hidden = false;
      var mock = document.getElementById('scanMock');
      if (mock) mock.hidden = true;
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 260, height: 140 } },
        function (decodedText) { onScanSuccess(decodedText); },
        function () { /* 프레임마다 나는 오류는 무시 */ }
      );
      scanView.status = 'on';
      scanView.message = '';
    } catch (e) {
      scanView.status = 'error';
      scanView.message = '카메라 권한이 없거나 지원되지 않아요. https 주소로 열었는지 확인하고, 안 되면 ISBN을 직접 입력해 주세요.';
    }
    updateScanChrome();
  }

  // 스캔 중에는 화면을 다시 그리면 카메라 화면이 사라지므로 상태 줄만 바꿈
  function updateScanChrome() {
    var st = document.getElementById('scanStatus');
    if (st) st.innerHTML = scanStatusHtml();
    var reader = document.getElementById('reader');
    if (reader) reader.hidden = !(scanView.status === 'on');
    var mock = document.getElementById('scanMock');
    if (mock) mock.hidden = (scanView.status === 'on');
  }

  async function stopScan() {
    try {
      if (scanner) { await scanner.stop(); await scanner.clear(); }
    } catch (e) { /* 무시 */ }
    scanView.status = 'idle';
    renderScan();
  }

  async function onScanSuccess(text) {
    var code = digitsOnly(text);
    if (!isBookBarcode(code)) {
      toast('책 바코드(978/979로 시작하는 13자리)가 아니에요');
      return;
    }
    await stopScan();
    toast('바코드를 읽었어요: ' + code);
    lookupIsbn(code);
  }

  /* ============================================================
     11. 이벤트
     ============================================================ */

  function onDocumentClick(ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var el = t.closest('[data-act]');
    if (!el) {
      if (t.id === 'backdrop') closeSheet();
      return;
    }
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    if (act === 'setBand') setBand(el.getAttribute('data-band'));
    else if (act === 'toggleWhy') {
      expandedWhy[id] = !expandedWhy[id];
      updateBooksList();
    }
    else if (act === 'toggleRead') toggleRead(id);
    else if (act === 'gotoLibrary') {
      state.ui.libBookId = id;
      saveState();
      holdingView = { mode: '', bookId: '', rows: [], error: '', loading: false, sub: '' };
      setTab('library');
    }
    else if (act === 'openActivity') openActivity(id);
    else if (act === 'closeSheet') closeSheet();
    else if (act === 'openSettings') openSettings();
    else if (act === 'openGoal') openGoal();
    else if (act === 'saveGoal') {
      var g = parseInt((document.getElementById('goalInput') || {}).value, 10);
      if (isNaN(g) || g < 0) { toast('숫자로 입력해 주세요'); return; }
      state.profile.goal = g;
      saveState();
      closeSheet();
      refreshCurrentTab();
      toast('목표를 ' + g + '권으로 저장했어요');
    }
    else if (act === 'saveSettings') {
      var nm = (document.getElementById('setName') || {}).value || '';
      var gl = parseInt((document.getElementById('setGoal') || {}).value, 10);
      var ky = (document.getElementById('setKey') || {}).value || '';
      var kk2 = (document.getElementById('setKakao') || {}).value || '';
      var rg = (document.getElementById('setRegion') || {}).value || '21';
      state.profile.name = nm.trim();
      if (!isNaN(gl) && gl >= 0) state.profile.goal = gl;
      state.settings.apiKey = ky.trim();
      state.settings.kakaoKey = kk2.trim();
      state.settings.region = rg;
      saveState();
      closeSheet();
      refreshCurrentTab();
      toast('설정을 저장했어요');
    }
    else if (act === 'rate') {
      sheetCtx.rating = parseInt(el.getAttribute('data-v'), 10) || 0;
      var stars = $$('.sheet .star');
      stars.forEach(function (s2) {
        var v = parseInt(s2.getAttribute('data-v'), 10);
        s2.classList.toggle('is-on', v <= sheetCtx.rating);
      });
    }
    else if (act === 'pickType') {
      sheetCtx.actType = el.getAttribute('data-type') || 'talk';
      var chips = $$('.sheet [data-act="pickType"]');
      chips.forEach(function (c) { c.classList.toggle('is-on', c.getAttribute('data-type') === sheetCtx.actType); });
    }
    else if (act === 'saveLog') {
      var memoEl = document.getElementById('logMemo');
      var memo = memoEl ? memoEl.value : '';
      saveLog(id, { type: sheetCtx.actType, rating: sheetCtx.rating, memo: memo });
      closeSheet();
      refreshCurrentTab();
      toast('독후기록을 저장했어요');
    }
    else if (act === 'toggleReadSheet') {
      toggleRead(id);
      var btn = el;
      btn.textContent = isRead(id) ? '✓ 읽음' : '읽음 체크';
      btn.className = 'btn ' + (isRead(id) ? 'btn-on' : 'btn-ghost');
    }
    else if (act === 'delLog') {
      state.logs = (state.logs || []).filter(function (l) { return l.id !== id; });
      saveState();
      renderShelf();
      toast('기록을 지웠어요');
    }
    else if (act === 'delCustom') {
      if (typeof window.confirm === 'function' && !window.confirm('이 책을 책장에서 지울까요?')) return;
      state.custom = (state.custom || []).filter(function (b) { return b.id !== id; });
      delete state.reading[id];
      saveState();
      renderShelf();
      toast('책장에서 지웠어요');
    }
    else if (act === 'lookupHolding') lookupHolding();
    else if (act === 'listLibraries') listLibraries();
    else if (act === 'demoHolding') showDemo();
    else if (act === 'openNaru') openNewWindow(naruUrl());
    else if (act === 'openBusan') openNewWindow('https://library.busan.go.kr/portal/intro/search/indexForAllDetail.do?menu_idx=12');
    else if (act === 'openNaruKey') openNewWindow('https://www.data4library.kr/myPage');
    else if (act === 'copyTitle') copyTitle();
    else if (act === 'startScan') startScan();
    else if (act === 'stopScan') stopScan();
    else if (act === 'lookupIsbn') {
      var mi = document.getElementById('manualIsbn');
      lookupIsbn(mi ? mi.value : '');
    }
    else if (act === 'addFound') addFoundBook();
    else if (act === 'checkFound') {
      var f = scanView.found;
      if (!f) return;
      transientBook = {
        id: 'scan_' + f.isbn, title: f.title, author: f.author || '저자 미상',
        publisher: f.publisher || '출판사 미상', year: f.year || '', isbn: f.isbn,
        band: 'etc', emoji: '📗', tags: [], why: '바코드로 찾은 책', activities: []
      };
      state.ui.libBookId = transientBook.id;
      saveState();
      holdingView = { mode: '', bookId: '', rows: [], error: '', loading: false, sub: '' };
      setTab('library');
    }
    else if (act === 'addCustom') {
      var title = (document.getElementById('cTitle') || {}).value || '';
      var author = (document.getElementById('cAuthor') || {}).value || '';
      var pub = (document.getElementById('cPublisher') || {}).value || '';
      var band = (document.getElementById('cBand') || {}).value || 'etc';
      var isbnRaw = (document.getElementById('cIsbn') || {}).value || '';
      var isbn = digitsOnly(isbnRaw);
      if (!title.trim()) { toast('제목을 입력해 주세요'); return; }
      if (isbn && !isValidISBN13(isbn)) { toast('ISBN 13자리를 확인해 주세요'); return; }
      addCustom({ title: title, author: author, publisher: pub, band: band, isbn: isbn });
      toast('내 책장에 등록했어요');
      renderScan();
    }
    else if (act === 'exportData' || act === 'shareStats') exportData();
    else if (act === 'resetAll') resetAll();
  }

  function onDocumentInput(ev) {
    var t = ev.target;
    if (!t || !t.id) return;
    if (t.id === 'q') setQuery(t.value);
    else if (t.id === 'libBook') { state.ui.libBookId = t.value; saveState(); holdingView = { mode: '', bookId: '', rows: [], error: '', loading: false, sub: '' }; renderLibrary(); }
    else if (t.id === 'regionSel') { state.settings.region = t.value; saveState(); }
    else if (t.id === 'dtlRegion') { state.settings.dtlRegion = t.value.replace(/[^0-9]/g, ''); saveState(); }
  }

  function onDocumentChange(ev) {
    var t = ev.target;
    if (!t || !t.id) return;
    if (t.id === 'libBook') { state.ui.libBookId = t.value; saveState(); renderLibrary(); }
    else if (t.id === 'regionSel') { state.settings.region = t.value; saveState(); }
  }

  function onKeydown(ev) {
    if (ev.key === 'Escape') { closeSheet(); return; }
    var t = ev.target;
    if (ev.key === 'Enter' && t && t.id === 'manualIsbn') {
      ev.preventDefault();
      lookupIsbn(t.value);
    }
  }

  function init() {
    document.addEventListener('click', onDocumentClick);
    document.addEventListener('input', onDocumentInput);
    document.addEventListener('change', onDocumentChange);
    document.addEventListener('keydown', onKeydown);
    $$('.tab-btn').forEach(function (b) {
      b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); });
    });
    var back = document.getElementById('backdrop');
    if (back) back.addEventListener('click', closeSheet);
    setTab(state.ui.tab || 'books');
    updateBrandSub();
  }

  /* ============================================================
     12. 테스트 훅 & 시작
     ============================================================ */

  window.__app = {
    state: function () { return state; },
    BOOKS: BOOKS,
    DEMO_LIBS: DEMO_LIBS,
    api: {
      allBooks: allBooks,
      getBook: getBook,
      filterBooks: filterBooks,
      computeStats: computeStats,
      isRead: isRead,
      isValidISBN13: isValidISBN13,
      isBookBarcode: isBookBarcode,
      parseLibsByBook: parseLibsByBook,
      parseKakao: parseKakao,
      parseBookExist: parseBookExist,
      parseGoogleBooks: parseGoogleBooks,
      parseOpenLibrary: parseOpenLibrary,
      demoScreen: demoScreen,
      setTab: setTab,
      setBand: setBand,
      setQuery: setQuery,
      toggleRead: toggleRead,
      saveLog: saveLog,
      addCustom: addCustom,
      lookupIsbn: lookupIsbn,
      lookupHolding: lookupHolding,
      listLibraries: listLibraries,
      showDemo: showDemo,
      resetAll: resetAll,
      exportData: exportData,
      render: function (tab) { setTab(tab); },
      addFoundBook: addFoundBook,
      guessBand: guessBand,
      holdingView: function () { return holdingView; },
      scanView: function () { return scanView; }
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
