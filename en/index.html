<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ea">
<meta name="color-scheme" content="light">
<meta name="description" content="AR 지수·렉사일 지수 순서로 영어원서를 고르고, 바코드로 등록해 북트리에 쌓고, 잠수네식 독후활동까지 한 화면에서.">
<title>책자람 English — 영어원서 독서 기록</title>
<style>
  :root{
    --paper:#f6f3ea; --card:#fffdf9; --ink:#26241e; --muted:#7b7768; --line:#e6e0d2;
    --brand:#2f5c8a; --brand-2:#3d76ad; --brand-soft:#e7eff7; --brand-ink:#1e3f61;
    --accent:#e0913d; --accent-soft:#fdf1e0; --danger:#bf5741; --danger-soft:#fbeae6;
    --green:#3f7f4f; --green-soft:#e8f3e6;
    --a1:#4f86b8; --a1s:#e6f0f8;
    --a2:#4f8a5f; --a2s:#e7f2e6;
    --a3:#b98a1f; --a3s:#fbf1db;
    --a4:#a85f36; --a4s:#fbeade;
    --a5:#8a5b9e; --a5s:#f2eaf7;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --shadow:0 10px 26px rgba(38,36,30,.07);
    --shadow-sm:0 3px 10px rgba(38,36,30,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #efe9d9 0%, #e9e3d4 55%, #e4ddcc 100%);
    color:var(--ink); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:440px; margin:0 auto; min-height:100dvh; background:var(--paper); position:relative;
    display:flex; flex-direction:column; box-shadow:0 0 0 1px rgba(38,36,30,.05), 0 24px 60px rgba(38,36,30,.10);}
  .appbar{position:sticky; top:0; z-index:30; background:rgba(246,243,234,.93); backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);}
  .appbar-in{display:flex; align-items:center; gap:10px; padding:12px 16px}
  .brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1}
  .brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(145deg,#e8f1fb,#d3e5f7); border:1px solid #cfe0f2; flex:none}
  .brand-name{font-size:17px; font-weight:800; letter-spacing:-.02em; line-height:1.2}
  .brand-sub{font-size:11.5px; color:var(--muted); letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line); background:#fffdf9;
    display:grid;place-items:center; color:var(--ink); cursor:pointer; flex:none}
  .icon-btn:active{transform:scale(.96)}
  .main{flex:1 0 auto; padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  .pad{padding:16px 16px 8px}
  .h1{font-size:21px; font-weight:800; letter-spacing:-.03em; margin:2px 0 4px}
  .sub{font-size:13px; color:var(--muted); margin:0 0 12px; letter-spacing:-.01em}
  .section-title{font-size:14px; font-weight:700; letter-spacing:-.02em; margin:22px 0 10px;
    display:flex; align-items:center; justify-content:space-between; gap:8px}
  .section-title .aside{font-size:12px; font-weight:500; color:var(--muted)}

  /* segmented */
  .seg{display:flex; gap:4px; background:#ece7da; border-radius:12px; padding:4px; margin-bottom:10px}
  .seg button{flex:1; border:0; background:transparent; font-family:inherit; font-size:13px; font-weight:700;
    color:var(--muted); border-radius:9px; padding:9px 6px; cursor:pointer; letter-spacing:-.02em}
  .seg button.on{background:#fffdf9; color:var(--brand-ink); box-shadow:var(--shadow-sm)}

  .searchbox{position:relative; margin-bottom:10px}
  .searchbox input{width:100%; height:46px; border-radius:14px; border:1px solid var(--line); background:#fffdf9;
    padding:0 14px 0 40px; font-size:15px; color:var(--ink); outline:none; font-family:inherit}
  .searchbox input:focus{border-color:var(--brand-2); box-shadow:0 0 0 3px rgba(61,118,173,.14)}
  .searchbox .ico{position:absolute; left:13px; top:13px; font-size:16px; opacity:.5}
  .chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrap{flex-wrap:wrap; overflow:visible}
  .chip{flex:none; border:1px solid var(--line); background:#fffdf9; color:var(--muted);
    border-radius:999px; padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer;
    letter-spacing:-.01em; font-family:inherit}
  .chip.is-on{background:var(--ink); border-color:var(--ink); color:#fff}
  .list-head{display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 10px; font-size:12.5px; color:var(--muted)}
  .list-head b{color:var(--brand); font-weight:800}

  /* book card */
  .book{display:flex; gap:12px; padding:13px; background:var(--card); border:1px solid var(--line);
    border-radius:18px; margin-bottom:10px; box-shadow:var(--shadow-sm)}
  .cover{width:62px; height:86px; border-radius:9px; flex:none; overflow:hidden; position:relative;
    background:linear-gradient(150deg,var(--cs1,#fde8c8),var(--cs2,#f7c78b));
    display:grid; place-items:center; font-size:26px;
    box-shadow:inset -6px 0 0 rgba(0,0,0,.05), 0 4px 10px rgba(38,36,30,.10)}
  .cover img{width:100%; height:100%; object-fit:cover; display:block}
  .book-main{min-width:0; flex:1}
  .book-title{font-size:15px; font-weight:800; letter-spacing:-.02em; margin:0 0 2px; line-height:1.3}
  .book-meta{font-size:12px; color:var(--muted); margin:0 0 6px; letter-spacing:-.01em}
  .badges{display:flex; gap:5px; flex-wrap:wrap; margin:0 0 7px}
  .bd{font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:7px; letter-spacing:-.01em}
  .bd-ar{background:var(--brand-soft); color:var(--brand-ink)}
  .bd-lex{background:var(--accent-soft); color:#96571c}
  .bd-j{background:#eae7dd; color:#5f5a4c}
  .bd-on{background:var(--green-soft); color:var(--green)}
  .bd-pic{background:#f6e8f4; color:#7d4780}
  .bd-rdr{background:#e2f0f5; color:#2c677d}
  .bd-ech{background:#fdf0dc; color:#95602a}
  .bd-chp{background:#ece7dd; color:#5a5346}
  .bd-fmt{display:inline-flex; align-items:center; gap:3px}
  .book-why{font-size:12.6px; color:#4c483e; margin:0 0 8px; line-height:1.55; letter-spacing:-.01em}
  .book-actions{display:flex; gap:6px; flex-wrap:wrap}
  .isbn{font-size:11px; color:#a09a8b; margin:8px 0 0; letter-spacing:.02em}

  .btn{border:1px solid var(--line); background:#fff; color:var(--ink); font-family:inherit;
    font-size:13.5px; font-weight:700; letter-spacing:-.02em; border-radius:11px; padding:10px 12px;
    cursor:pointer; display:inline-flex; align-items:center; gap:5px; justify-content:center;
    text-decoration:none; line-height:1.25}
  .btn:active{transform:scale(.985)}
  .btn.sm{font-size:12.5px; padding:8px 10px; border-radius:10px}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%; padding:14px}
  .btn:disabled{opacity:.5}
  .tag{font-size:11.5px; color:var(--brand-2); font-weight:700; letter-spacing:-.01em}

  /* library */
  .lib-card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:15px;
    margin-bottom:11px; box-shadow:var(--shadow-sm)}
  .lib-card.main{border-color:#cfdff0; background:linear-gradient(180deg,#f5faff,#fffdf9)}
  .lib-name{font-size:15.5px; font-weight:800; margin:0 0 3px; letter-spacing:-.02em}
  .lib-note{font-size:12.5px; color:var(--muted); margin:0 0 6px}
  .lib-row{font-size:13px; color:#43403a; margin:3px 0; display:flex; gap:7px; align-items:flex-start}
  .lib-row .k{color:var(--muted); flex:none; width:52px; font-size:12px; padding-top:1px}
  .kv{font-size:12.5px; color:#5c584d}

  /* shelf */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:4px 0 12px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 10px; text-align:center}
  .stat b{display:block; font-size:19px; font-weight:800; letter-spacing:-.03em; color:var(--brand-ink)}
  .stat span{font-size:11px; color:var(--muted); letter-spacing:-.01em}
  .rec{display:flex; gap:11px; padding:12px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; margin-bottom:9px; box-shadow:var(--shadow-sm); cursor:pointer}
  .rec .cover{width:48px;height:66px;font-size:20px}
  .rec-title{font-size:14px; font-weight:800; margin:0 0 2px; line-height:1.3; letter-spacing:-.02em}
  .rec-meta{font-size:11.5px; color:var(--muted)}
  .rec-flags{font-size:11px; color:var(--brand-2); font-weight:700; margin-top:3px}

  /* tree */
  .tree-wrap{position:relative; background:linear-gradient(180deg,#f2f8f3 0%,#f7f6ec 62%,#f4efe0 100%);
    border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:var(--shadow-sm); margin-bottom:12px}
  .tree-svg{display:block; width:100%; height:auto}
  .goalbar{margin:2px 0 12px}
  .goalbar .row{display:flex; align-items:baseline; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:6px}
  .goalbar .row b{color:var(--brand-ink); font-weight:800; font-size:13.5px}
  .bar{height:11px; border-radius:999px; background:#e8e2d3; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--brand-2),var(--brand)); transition:width .4s ease}
  .legend{display:flex; flex-wrap:wrap; gap:9px; font-size:11px; color:var(--muted); margin-top:9px}
  .legend span{display:inline-flex; align-items:center; gap:4px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

  /* sheet */
  .backdrop{position:fixed; inset:0; background:rgba(30,28,24,.42); z-index:40; opacity:0; transition:opacity .2s}
  .backdrop.show{opacity:1}
  .sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,102%); width:100%; max-width:440px;
    max-height:92dvh; overflow-y:auto; background:var(--paper); z-index:50; border-radius:22px 22px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,.18); transition:transform .26s cubic-bezier(.3,.9,.3,1);
    padding-bottom:calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch}
  .sheet.show{transform:translate(-50%,0)}
  .sheet-grab{width:40px;height:4px;border-radius:99px;background:#d8d2c2;margin:10px auto 4px}
  .sheet-in{padding:8px 18px 10px}
  .sheet h3{font-size:18px; font-weight:800; letter-spacing:-.03em; margin:6px 0 3px}
  .field{margin:12px 0}
  .field label{display:block; font-size:12.5px; font-weight:700; color:#5f5b4e; margin-bottom:5px; letter-spacing:-.01em}
  .field input, .field textarea, .field select{width:100%; border:1px solid var(--line); background:#fffdf9;
    border-radius:11px; padding:11px 12px; font-size:14.5px; font-family:inherit; color:var(--ink); outline:none}
  .field input:focus, .field textarea:focus{border-color:var(--brand-2); box-shadow:0 0 0 3px rgba(61,118,173,.13)}
  .field textarea{resize:vertical; min-height:64px; line-height:1.5}
  .hint{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.45}
  .check{display:flex; align-items:center; gap:9px; padding:10px 12px; border:1px solid var(--line);
    border-radius:12px; background:#fffdf9; margin-bottom:7px; cursor:pointer; font-size:14px; font-weight:600}
  .check input{width:19px;height:19px; accent-color:var(--brand); flex:none}
  .check.on{background:var(--brand-soft); border-color:#c7dcef}
  .counter{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .counter button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line); background:#fff; font-size:18px;
    font-weight:700; cursor:pointer; color:var(--ink)}
  .counter b{font-size:17px; min-width:26px; text-align:center}
  .acts li{list-style:none; display:flex; gap:9px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.5px; line-height:1.5}
  .acts{padding:0; margin:0}
  .acts li:last-child{border-bottom:0}
  .acts input{width:19px;height:19px; accent-color:var(--green); margin-top:2px; flex:none}
  .word-row{display:flex; gap:6px; margin-bottom:6px}
  .word-row input{flex:1}
  .linkrow{display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 4px}
  .linkrow .btn{flex:1 1 46%}
  .stars{display:flex; gap:6px; font-size:24px; cursor:pointer; user-select:none}
  .stars span{opacity:.25}
  .stars span.on{opacity:1}

  .tabbar{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:440px; z-index:35;
    background:rgba(255,253,249,.96); backdrop-filter:blur(12px); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab-btn{flex:1; border:0; background:transparent; font-family:inherit; color:var(--muted); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border-radius:12px}
  .tab-btn .tab-ico{width:22px;height:22px}
  .tab-label{font-size:10.5px; font-weight:700; letter-spacing:-.01em}
  .tab-btn.is-active{color:var(--brand)}
  .toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translate(-50%,14px);
    background:rgba(38,36,30,.93); color:#fff; font-size:13px; font-weight:600; padding:10px 16px; border-radius:12px;
    opacity:0; pointer-events:none; transition:.22s; z-index:60; max-width:340px; text-align:center}
  .toast.show{opacity:1; transform:translate(-50%,0)}
  #reader{width:100%; border-radius:14px; overflow:hidden; background:#0d0d0d; margin-bottom:8px; min-height:0}
  #reader video{border-radius:14px}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:26px 10px; line-height:1.6}
  .note{font-size:11.5px; color:#8a8577; line-height:1.5; margin-top:8px}
  .pill{display:inline-block; font-size:10.5px; font-weight:800; color:#96571c; background:var(--accent-soft);
    border-radius:7px; padding:2px 6px; margin-left:4px}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="appbar-in">
      <div class="brand">
        <span class="brand-mark">🌳</span>
        <div style="min-width:0">
          <div class="brand-name">책자람 English</div>
          <div class="brand-sub" id="brandSub">AR·렉사일 순서로 고르는 영어원서</div>
        </div>
      </div>
      <button class="icon-btn" id="btnSettings" aria-label="설정">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.96 4.6 1.7 1.7 0 0 0 10 3.04V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="main" id="main">
    <section id="tab-books" aria-label="추천도서"></section>
    <section id="tab-library" aria-label="도서관 조회" hidden></section>
    <section id="tab-scan" aria-label="바코드 등록" hidden></section>
    <section id="tab-shelf" aria-label="내 책장" hidden></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="주요 메뉴">
    <button class="tab-btn is-active" data-tab="books" role="tab" aria-selected="true">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5V5.5"></path><path d="M8 7h7"></path>
      </svg><span class="tab-label">추천도서</span>
    </button>
    <button class="tab-btn" data-tab="library" role="tab" aria-selected="false">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 4l9 6.5"></path><path d="M5 10v9M9.5 10v9M14.5 10v9M19 10v9"></path><path d="M3 21h18"></path>
      </svg><span class="tab-label">도서관</span>
    </button>
    <button class="tab-btn" data-tab="scan" role="tab" aria-selected="false">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"></path><path d="M8 8v8M11 8v8M14 8v8M17 8v8"></path>
      </svg><span class="tab-label">바코드</span>
    </button>
    <button class="tab-btn" data-tab="shelf" role="tab" aria-selected="false">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V11M9.3 20V5M14.7 20v-7M20 20V8"></path>
      </svg><span class="tab-label">내 책장</span>
    </button>
  </nav>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  /* =========================================================
     0. 데이터 · 저장소
     ========================================================= */
  var BOOKS = [{"id":"brown-bear","title":"Brown Bear, Brown Bear, What Do You See?","author":"Bill Martin Jr. · Eric Carle","isbn":"9780805047905","ar":1.5,"lex":"AD200L","il":"LG","pts":0.5,"pages":28,"pub":"Henry Holt","year":1967,"j":2,"theme":"색깔·동물·리듬","why":"“Brown bear, brown bear, what do you see?” 질문과 대답이 계속 이어지는 리듬 그림책. 색깔과 동물 이름을 처음 영어로 만나는 책.","acts":["동물 이름·색깔 단어를 소리 내어 따라 읽고, 마지막 “I see a teacher looking at me”를 “I see my mom”처럼 가족으로 바꿔 말하기","색종이로 동물 카드를 만들어 가족과 “What do you see?” 질문 놀이하기"],"format":"picture"},{"id":"polar-bear","title":"Polar Bear, Polar Bear, What Do You Hear?","author":"Bill Martin Jr. · Eric Carle","isbn":"9780805053883","ar":2.1,"lex":"AD670L","il":"LG","pts":0.5,"pages":28,"pub":"Henry Holt","year":1991,"j":3,"theme":"동물·소리·의성어","why":"Brown Bear의 자매편. 동물들의 울음소리를 묻고 답하는 구조로 hear/sound 표현과 동물 소리를 배운다.","acts":["동물 울음소리를 영어로 흉내 내며 “What do you hear?” 놀이하기 (roar, snort, flute…)","“I hear a ___” 문장을 가족·친구로 바꿔 5문장 말해 보기"],"format":"picture"},{"id":"hungry-caterpillar","title":"The Very Hungry Caterpillar","author":"Eric Carle","isbn":"9780399226908","ar":2.9,"lex":"AD460L","il":"LG","pts":0.5,"pages":26,"pub":"Philomel","year":1969,"j":4,"theme":"성장·요일·음식","why":"배고픈 애벌레가 요일마다 음식을 먹고 마침내 나비가 되는 이야기. 요일·숫자·음식 단어가 반복된다.","acts":["요일별로 먹은 음식을 영어로 다시 말하기 (On Monday he ate through one apple)","종이로 애벌레와 나비를 만들어 성장 과정을 순서대로 말하기"],"format":"picture"},{"id":"dear-zoo","title":"Dear Zoo","author":"Rod Campbell","isbn":"9780027164404","ar":1.6,"lex":"150L","il":"LG","pts":0.5,"pages":24,"pub":"Little Simon","year":1982,"j":3,"theme":"동물·형용사·플랩북","why":"동물원에 편지를 보내 애완동물을 부탁하지만 매번 조건에 맞지 않아 돌려보내는 이야기. 형용사와 동물 이름이 반복된다.","acts":["“He was too ___” 문장으로 동물마다 이유 말하기 (too big, too tall, too fierce)","내가 애완동물로 받고 싶은 동물을 골라 “I would keep it because ___”로 말하기"],"format":"picture"},{"id":"goodnight-moon","title":"Goodnight Moon","author":"Margaret Wise Brown","isbn":"9780064430173","ar":1.8,"lex":"AD360L","il":"LG","pts":0.5,"pages":32,"pub":"HarperCollins","year":1947,"j":3,"theme":"잠자리·리듬·사물","why":"잠자리에 든 아기 토끼가 방 안의 사물과 달, 별에게 차례로 인사하는 책. 느린 리듬과 반복 표현이 편안하다.","acts":["방 안 물건을 하나씩 가리키며 “Goodnight ___” 말하기","내 방에 있는 것 다섯 개를 영어로 적고 잠자리 인사 문장 만들기"],"format":"picture"},{"id":"snowy-day","title":"The Snowy Day","author":"Ezra Jack Keats","isbn":"9780140501827","ar":2.5,"lex":"AD500L","il":"LG","pts":0.5,"pages":40,"pub":"Puffin","year":1962,"j":3,"theme":"겨울·눈·감각","why":"눈 내린 아침, 피터가 눈을 밟고 눈사람을 만드는 하루. 겨울 풍경과 감각 표현이 담담하게 이어진다.","acts":["“crunch, crunch”처럼 눈 밟는 소리를 나타내는 영어 표현 찾아 말하기","눈 내린 날의 하루를 “First I ___, then I ___”로 세 문장 쓰기"],"format":"picture"},{"id":"wild-things","title":"Where the Wild Things Are","author":"Maurice Sendak","isbn":"9780064431781","ar":3.4,"lex":"AD740L","il":"LG","pts":0.5,"pages":48,"pub":"HarperCollins","year":1963,"j":4,"theme":"상상·감정·가족","why":"장난을 친 맥스가 괴물의 나라로 떠나 왕이 되었다가 결국 따뜻한 저녁밥이 있는 집으로 돌아온다.","acts":["괴물들의 “Let the wild rumpus start!” 장면을 온몸으로 역할극 하기","나만의 괴물 나라를 그리고 “In my land, ___”로 규칙 세 가지 영어로 말하기"],"format":"picture"},{"id":"five-monkeys","title":"Five Little Monkeys Jumping on the Bed","author":"Eileen Christelow","isbn":"9780395557013","ar":1.4,"lex":"310L","il":"LG","pts":0.5,"pages":32,"pub":"Clarion","year":1989,"j":2,"theme":"숫자·반복·노래","why":"침대 위에서 다섯 원숭이가 뛰다가 하나씩 떨어지는 노래 같은 그림책. 숫자 세기와 반복 문장이 중심이다.","acts":["“Five little monkeys jumping on the bed” 노래를 손가락으로 숫자 세며 부르기","one~five를 세며 “___ little monkeys” 문장으로 직접 바꿔 부르기"],"format":"picture"},{"id":"go-dog-go","title":"Go, Dog. Go!","author":"P.D. Eastman","isbn":"9780394800202","ar":1.2,"lex":"240L","il":"LG","pts":0.5,"pages":72,"pub":"Random House","year":1961,"j":2,"theme":"반대말·자동차·색","why":"개들이 자동차를 타고 어디론가 달려가는 짧은 문장 책. 반대말·색깔·위치 표현이 반복된다.","acts":["big/small, up/down, in/out 같은 반대말 짝을 만들어 말하기","집 안 물건으로 “on the ___”, “under the ___” 위치 문장 놀이하기"],"format":"readers"},{"id":"hop-on-pop","title":"Hop on Pop","author":"Dr. Seuss","isbn":"9780394800295","ar":1.5,"lex":"190L","il":"LG","pts":0.5,"pages":72,"pub":"Random House","year":1963,"j":2,"theme":"라임·짧은 모음","why":"짧은 모음과 라임이 반복되는 초보 읽기 책. 소리 내어 읽기의 첫 단계로 좋다.","acts":["라임이 맞는 단어 짝 찾기 (hop/pop, cup/pup)","같은 라임으로 “___ on ___” 문장을 새로 만들어 읽기"],"format":"readers"},{"id":"green-eggs","title":"Green Eggs and Ham","author":"Dr. Seuss","isbn":"9780394800165","ar":1.5,"lex":"210L","il":"LG","pts":0.5,"pages":72,"pub":"Random House","year":1960,"j":2,"theme":"반복·시도·음식","why":"“I do not like them, Sam-I-am”이 계속 반복되며 결국 맛을 보게 되는 이야기. 짧은 문장이 반복된다.","acts":["“I do not like ___” 문장으로 내가 싫어하는 음식 말하기","“in a house, with a mouse”처럼 장소·친구를 바꿔가며 문장 늘리기"],"format":"readers"},{"id":"cat-in-the-hat","title":"The Cat in the Hat","author":"Dr. Seuss","isbn":"9780394800011","ar":2.1,"lex":"430L","il":"LG","pts":0.5,"pages":72,"pub":"Random House","year":1957,"j":3,"theme":"라임·집·장난","why":"비 오는 날 집에 온 고양이가 온갖 장난을 벌이는 라임 이야기. 짧은 문장과 리듬이 살아 있다.","acts":["라임 단어를 찾아 소리 내어 읽고, 같은 라임의 새 단어 만들기","집에 초대하고 싶은 상상 속 친구를 그리고 “He would ___”로 소개하기"],"format":"readers"},{"id":"are-you-my-mother","title":"Are You My Mother?","author":"P.D. Eastman","isbn":"9780394800189","ar":1.6,"lex":"240L","il":"LG","pts":0.5,"pages":72,"pub":"Random House","year":1960,"j":3,"theme":"가족·질문·반복","why":"둥지에서 떨어진 새끼 새가 엄마를 찾아 묻고 다니는 이야기. “Are you my mother?”가 반복된다.","acts":["동물마다 “Are you my mother?” / “No, I am a ___” 역할극 하기","엄마를 닮은 점 세 가지를 영어로 “My mom is ___” 문장 만들기"],"format":"readers"},{"id":"biscuit","title":"Biscuit","author":"Alyssa Satin Capucilli","isbn":"9780064442121","ar":1.4,"lex":"190L","il":"LG","pts":0.5,"pages":32,"pub":"HarperCollins","year":1996,"j":2,"theme":"강아지·잠자리·반복","why":"잠자리에 들기 싫어하는 강아지 비스킷과 아이의 짧은 대화. 반복되는 짧은 문장이 첫 읽기에 좋다.","acts":["“Woof, woof!” 대신 “Time for bed, Biscuit”을 번갈아 역할극 하기","우리 집 반려동물(또는 인형)에게 영어로 잘 자라고 말해 보기"],"format":"readers","series":"Biscuit"},{"id":"bathtime-biscuit","title":"Bathtime for Biscuit","author":"Alyssa Satin Capucilli","isbn":"9780064442640","ar":1.1,"lex":"150L","il":"LG","pts":0.5,"pages":32,"pub":"HarperCollins","year":1998,"j":2,"theme":"강아지·목욕·반복","why":"비스킷이 목욕을 피해 도망다니는 짧은 이야기. 현재형 문장이 반복된다.","acts":["“Biscuit wants to ___” 문장을 다섯 개 말하기","목욕 순서를 영어로 말하기 (get in, splash, dry off, shake)"],"format":"readers","series":"Biscuit"},{"id":"biscuit-friend","title":"Biscuit Finds a Friend","author":"Alyssa Satin Capucilli","isbn":"9780064442435","ar":0.8,"lex":"210L","il":"LG","pts":0.5,"pages":32,"pub":"HarperCollins","year":1997,"j":1,"theme":"강아지·친구·반복","why":"비스킷이 길 잃은 새끼 오리를 만나 집으로 데려다주는 이야기. 아주 짧은 문장으로 이루어져 있다.","acts":["“Woof! Woof!” 소리와 함께 “What is it?” “It is a ___” 문장 연습하기","친구를 도와준 경험을 한 문장 영어로 말하기"],"format":"readers","series":"Biscuit"},{"id":"pete-cat-shoes","title":"Pete the Cat: I Love My White Shoes","author":"Eric Litwin","isbn":"9780061906220","ar":1.5,"lex":"AD460L","il":"LG","pts":0.5,"pages":40,"pub":"HarperCollins","year":2010,"j":2,"theme":"노래·색깔·긍정","why":"새 신발이 딸기·블루베리·진흙에 젖어도 “It's all good”이라며 노래하는 고양이 이야기.","acts":["“I love my ___ shoes” 노래를 색깔 바꿔 부르기","기분이 나빠질 일을 “It's all good”으로 바꿔 말하는 연습하기"],"format":"picture","series":"Pete the Cat"},{"id":"pete-cat-buttons","title":"Pete the Cat and His Four Groovy Buttons","author":"Eric Litwin","isbn":"9780062110589","ar":2.2,"lex":"AD350L","il":"LG","pts":0.5,"pages":40,"pub":"HarperCollins","year":2012,"j":3,"theme":"숫자·노래·긍정","why":"단추가 하나씩 떨어질 때마다 숫자를 세며 노래하는 책. 빼기 개념과 긍정 문장이 함께 나온다.","acts":["단추가 떨어질 때마다 “Four/Three/Two/One” 숫자를 영어로 세기","“Buttons come and buttons go” 문장을 따라 읽고 내 물건으로 바꿔 말하기"],"format":"picture","series":"Pete the Cat"},{"id":"we-are-in-a-book","title":"We Are in a Book!","author":"Mo Willems","isbn":"9781423133087","ar":0.9,"lex":"200L","il":"LG","pts":0.5,"pages":64,"pub":"Hyperion","year":2010,"j":1,"theme":"책·대화·유머","why":"제럴드와 피기에게 독자가 보인다는 사실을 깨닫는 이야기. 아주 짧은 대사로 대화체를 배운다.","acts":["책 속 인물에게 말을 거는 문장 “Hello, reader!” “Can you say ___?” 역할극 하기","내 이름을 넣어 “I am in a book!” 문장으로 짧은 대사 만들기"],"format":"readers","series":"Elephant & Piggie"},{"id":"bird-on-head","title":"There Is a Bird on Your Head!","   function visibleBooks() {
    var q = view.q.trim().toLowerCase();
    var band = view.band;
    var books = BOOKS.filter(function (b) {
      if (q) {
        var hay = (b.title + ' ' + b.author + ' ' + b.isbn + ' ' + (b.theme || '') + ' ' + (b.series || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (view.format !== 'all' && b.format !== view.format) return false;
      if (view.j !== 'all' && b.j !== parseInt(view.j, 10)) return false;
      if (band !== 'all') {
        var bands = view.mode === 'ar' ? AR_BANDS : LX_BANDS;
        var def = bands.filter(function (x) { return x.id === band; })[0];
        if (def && def.test) {
          var v = view.mode === 'ar' ? b.ar : lexNum(b.lex);
          if (!def.test(v)) return false;
        }
      }
      return true;
    });
    books.sort(function (x, y) {
      var a = view.mode === 'ar' ? x.ar : lexNum(x.lex);
      var bv = view.mode === 'ar' ? y.ar : lexNum(y.lex);
      if (a === bv) return x.title.localeCompare(y.title);
      return (a - bv) * view.dir;
    });
    return books;
  }

  function startScan() {
    if (typeof Html5Qrcode === 'undefined') { toast('스캔 모듈을 불러오지 못했어요. ISBN을 직접 넣어 주세요'); return; }
    var box = document.getElementById('reader');
    if (!box) return;
    try {
      var fmts = [];
      if (window.Html5QrcodeSupportedFormats) {
        fmts = [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.CODE_128];
      }
      view.qr = fmts.length ? new Html5Qrcode('reader', { formatsToSupport: fmts, verbose: false }) : new Html5Qrcode('reader');
      view.scanOn = true;
      view.qr.start({ facingMode: 'environment' },
        { fps: 10, qrbox: { width: 260, height: 150 } },
        onScanSuccess,
        function () { })
        .then(function () {
          var s = document.getElementById('scanStart'), t = document.getElementById('scanStop');
          if (s) s.disabled = true; if (t) t.disabled = false;
          toast('바코드를 비추면 자동으로 인식돼요');
        })
        .catch(function () {
          view.scanOn = false;
          toast('카메라를 열 수 없어요. ISBN을 직접 넣어 주세요');
        });
    } catch (e) {
      view.scanOn = false;
      toast('카메라를 열 수 없어요');
    }
  }
  function stopScan() {
    view.scanOn = false;
    var s = document.getElementById('scanStart'), t = document.getElementById('scanStop');
    if (s) s.disabled = false; if (t) t.disabled = true;
    if (view.qr) {
      try { view.qr.stop().then(function () { try { view.qr.clear(); } catch (e) { } }); } catch (e) { }
      view.qr = null;
    }
  }

  async function lookupISBN(isbn) {
    var out = document.getElementById('scanOut');
    if (!out) return;
    out.innerHTML = '<div class="empty">책 정보를 찾는 중…</div>';
    var known = BOOKS.filter(function (b) { return b.isbn === isbn; })[0];
    var found = null;
    try {
      var r = await fetch('https://openlibrary.org/api/books?bibkeys=ISBN%3A' + isbn + '&format=json&jscmd=data', { cache: 'no-store' });
      var j = await r.json();
      var k = 'ISBN:' + isbn;
      if (j[k]) {
        var d = j[k];
        found = {
          title: d.title,
          author: (d.authors || []).map(function (a) { return a.name; }).join(', '),
          pages: d.number_of_pages || '',
          year: (d.publish_date || ''),
          pub: ((d.publishers || [])[0] || {}).name || ''
        };
      }
    } catch (e) { }
    if (!found) {
      try {
        var r2 = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn);
        var j2 = await r2.json();
        if (j2.items && j2.items[0]) {
          var vi = j2.items[0].volumeInfo;
          found = { title: vi.title, author: (vi.authors || []).join(', '), pages: vi.pageCount || '', year: vi.publishedDate || '', pub: vi.publisher || '' };
        }
      } catch (e) { }
    }
    if (!found && known) {
      found = { title: known.title, author: known.author, pages: known.pages, year: known.year, pub: known.pub };
    }
    if (!known && found && found.title) {
      var nt = normTitle(found.title);
      known = BOOKS.filter(function (b) { return normTitle(b.title) === nt; })[0];
    }
    if (!found) {
      out.innerHTML = '<div class="empty">이 ISBN을 찾지 못했어요.<br>제목과 저자를 직접 넣어 등록해 주세요.</div>' +
        '<button class="btn wide" data-act="manual" data-isbn="' + isbn + '">직접 입력해서 담기</button>';
      return;
    }
    var b = known ? Object.assign({}, known) : {
      id: 'c' + isbn, title: found.title, author: found.author, isbn: isbn,
      ar: 0, lex: '', j: 0, theme: '', why: '', acts: [], src: 'custom', emoji: '📘'
    };
    b.title = known ? known.title : found.title;
    b.author = known ? known.author : (found.author || b.author);
    b.isbn = isbn;
    if (known) found = Object.assign({}, found, { title: known.title, author: known.author });
    view.pending = b;
    var cover = 'https://covers.openlibrary.org/b/isbn/' + isbn + '-L.jpg';
    out.innerHTML = '<div class="lib-card" style="margin-top:14px">' +
      '<div style="display:flex;gap:12px">' +
      '<div class="cover" style="width:70px;height:98px" data-emoji="📘"><img alt="" data-isbn="' + isbn + '" src="' + cover + '" onerror="cvFallback(this)"></div>' +
      '<div style="min-width:0;flex:1"><p class="lib-name" style="font-size:15px">' + esc(found.title) + '</p>' +
      '<p class="lib-meta" style="font-size:12.5px;color:var(--muted);margin:0 0 6px">' + esc(found.author || '') + '</p>' +
      '<p class="kv">ISBN ' + isbn + (found.pages ? ' · ' + found.pages + 'p' : '') + (found.pub ? ' · ' + esc(found.pub) : '') + '</p>' +
      (known ? '<div class="badges" style="margin-top:6px">' + fmtBadge(known.format) + '<span class="bd bd-ar">AR ' + known.ar.toFixed(1) + '</span><span class="bd bd-lex">' + known.lex + '</span><span class="bd bd-j">J' + known.j + '</span></div>'
        : '<p class="note" style="margin-top:6px">추천도서 목록에 없는 책이라 AR·렉사일은 직접 넣어 주세요.</p>') +
      '</div></div>' +
      '<div class="linkrow"><button class="btn primary" data-act="addPending">내 책장에 담기</button>' +
      '<button class="btn" data-act="recordPending">바로 독서기록</button></div>' +
      '<div class="linkrow"><a class="btn sm" href="' + ytReadAloud(b) + '" target="_blank" rel="noopener">▶ Read Aloud 찾기</a>' +
      '<a class="btn sm" href="' + ytAudio(b) + '" target="_blank" rel="noopener">🎧 오디오북 찾기</a></div>' +
      '</div>';
  }

  /* =========================================================
     8. 내 책장 · 북트리
     ========================================================= */
  function renderShelf() {
    var recs = allRecs();
    var h = '<div class="pad">';
    h += '<h1 class="h1">내 책장</h1>';
    h += '<div class="seg" id="shelfSeg">' +
      '<button data-sv="log" class="' + (view.shelfView === 'log' ? 'on' : '') + '">독서기록</button>' +
      '<button data-sv="tree" class="' + (view.shelfView === 'tree' ? 'on' : '') + '">🌳 북트리</button></div>';
    if (view.shelfView === 'tree') {
      h += treeHTML();
    } else {
      h += '<div class="stat-grid">' +
        '<div class="stat"><b>' + totalReads() + '</b><span>총 읽은 권수</span></div>' +
        '<div class="stat"><b>' + monthReads() + '</b><span>이번 달</span></div>' +
        '<div class="stat"><b>' + uniqueCount() + '</b><span>읽은 책 종류</span></div></div>';
      if (!recs.length) {
        h += '<div class="empty">아직 담은 책이 없어요.<br><b>추천도서</b>에서 마음에 드는 책을 골라 <b>독서기록</b>을 눌러 보세요.</div>';
      }
      recs.forEach(function (r) {
        var logs = r.logs || [];
        var last = logs[logs.length - 1];
        var flags = [];
        if (last) {
          if (last.flow) flags.push('흘려듣기');
          if (last.focus) flags.push('집중듣기');
          if (last.aloud) flags.push('소리내어');
          if (last.alone) flags.push('혼자읽기');
          if (last.repeats) flags.push('+' + last.repeats + '회독');
        }
        h += '<div class="rec" data-act="openRec" data-id="' + r.id + '">';
        h += coverHTML(r, true);
        h += '<div style="min-width:0;flex:1">';
        h += '<p class="rec-title">' + esc(r.title) + '</p>';
        h += '<p class="rec-meta" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">' +
          fmtBadge(fmtOf(r.id)) + '<span>' + (r.ar ? 'AR ' + Number(r.ar).toFixed(1) : 'AR —') + ' · ' + (r.lex || 'Lexile —') +
          (r.j ? ' · J' + r.j : '') + '</span></p>';
        h += '<p class="rec-meta">' + (logs.length ? '기록 ' + logs.length + '회 · ' + fmtDate(last.date) : '아직 기록 없음') + '</p>';
        if (flags.length) h += '<p class="rec-flags">' + flags.join(' · ') + '</p>';
        h += '</div></div>';
      });
      h += '<button class="btn wide" data-act="openSettings" style="margin-top:6px">⚙️ 설정 · 목표 권수 바꾸기</button>';
    }
    h += '</div>';
    var el = document.getElementById('tab-shelf');
    el.innerHTML = h;
  }


  /* ---------- 북트리 ---------- */
  var TREE_ANCHORS = [
    [180, 96], [148, 104], [212, 102], [124, 122], [236, 120], [166, 82], [198, 84],
    [104, 146], [256, 144], [140, 78], [222, 76], [180, 68], [96, 176], [264, 172],
    [116, 196], [244, 194], [152, 132], [208, 130], [132, 168], [228, 166],
    [166, 118], [194, 116], [86, 138], [274, 136]
  ];
  function treeHTML() {
    var recs = allRecs().filter(function (r) { return (r.logs || []).length > 0; });
    var ghosts = allRecs().filter(function (r) { return !(r.logs || []).length; });
    var leaves = recs.concat(ghosts).slice(0, 60);
    var goal = store.settings.goal || 100;
    var total = totalReads();
    var pct = Math.max(0, Math.min(100, Math.round(total / goal * 1000) / 10));

    var W = 360, H = 320;
    var svg = '<svg class="tree-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="북트리">';
    svg += '<defs>' +
      '<radialGradient id="cg1" cx="50%" cy="45%" r="62%"><stop offset="0%" stop-color="#eef6e4"/><stop offset="100%" stop-color="#dfeed2"/></radialGradient>' +
      '<radialGradient id="cg2" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#e6f1d9" stop-opacity=".9"/><stop offset="100%" stop-color="#e6f1d9" stop-opacity="0"/></radialGradient>' +
      '</defs>';
    /* 캐노피 */
    svg += '<ellipse cx="180" cy="126" rx="126" ry="82" fill="url(#cg1)"/>';
    svg += '<ellipse cx="118" cy="158" rx="66" ry="52" fill="url(#cg2)"/>';
    svg += '<ellipse cx="246" cy="152" rx="70" ry="54" fill="url(#cg2)"/>';
    svg += '<ellipse cx="180" cy="86" rx="74" ry="48" fill="url(#cg2)"/>';
    /* 캐노피 결 (은은한 잎 질감) */
    var seedPts = [[168,72],[132,96],[208,88],[96,150],[256,140],[120,124],[240,116],[180,58],[150,150],[212,146],[110,178],[250,172],[134,70],[226,64],[86,132],[274,126],[160,104],[200,108],[178,132],[146,128],[214,76],[102,110],[258,106],[160,182],[200,180],[122,142],[238,144],[180,96],[152,96],[212,112]];
    seedPts.forEach(function (p, i) {
      var sz2 = 0.55 + ((i * 7) % 5) * 0.06, h2 = 20 * sz2, s2 = 6.2 * sz2;
      svg += '<path transform="translate(' + p[0] + ',' + p[1] + ') rotate(' + ((i * 61) % 120 - 60) + ')" d="M0,0 C' + s2.toFixed(1) + ',-' + (h2 * 0.34).toFixed(1) + ' ' + s2.toFixed(1) + ',-' + (h2 * 0.74).toFixed(1) + ' 0,-' + h2.toFixed(1) +
        ' C-' + s2.toFixed(1) + ',-' + (h2 * 0.74).toFixed(1) + ' -' + s2.toFixed(1) + ',-' + (h2 * 0.34).toFixed(1) + ' 0,0Z" fill="#cfe3c0" opacity=".55"/>';
    });
    /* 땅 */
    svg += '<ellipse cx="180" cy="300" rx="108" ry="13" fill="#e2dbc4"/>';
    svg += '<ellipse cx="180" cy="297" rx="88" ry="9" fill="#efe9d7"/>';
    /* 가지 */
    var BR = [
      ['M180 226 C176 200, 178 186, 180 172', 13],
      ['M180 172 C170 150, 150 132, 138 112', 8],
      ['M180 172 C192 148, 212 130, 224 110', 8],
      ['M172 206 C150 190, 126 176, 110 156', 6],
      ['M190 206 C214 190, 238 176, 252 154', 6],
      ['M138 112 C130 100, 124 94, 118 84', 3.4],
      ['M138 118 C144 110, 148 102, 150 94', 3],
      ['M224 110 C232 100, 236 94, 242 84', 3.4],
      ['M222 118 C216 110, 212 104, 210 94', 3],
      ['M180 172 C180 150, 180 130, 180 108', 5],
      ['M110 156 C104 148, 100 142, 96 134', 2.8],
      ['M252 154 C258 146, 262 140, 266 132', 2.8]
    ];
    BR.forEach(function (bd) {
      svg += '<path d="' + bd[0] + '" stroke="#a9885f" stroke-width="' + bd[1] + '" fill="none" stroke-linecap="round"/>';
    });
    svg += '<path d="M166 300 C162 266, 168 244, 172 226 L188 226 C192 244, 198 266, 194 300 Z" fill="#a9885f"/>';
    svg += '<path d="M170 296 C168 268, 172 246, 176 228" stroke="#8e6f4c" stroke-width="2" fill="none" opacity=".45"/>';

    if (!leaves.length) {
      [[130, 150], [214, 132], [176, 190]].forEach(function (p) {
        svg += '<path d="M' + p[0] + ',' + p[1] + ' C' + (p[0] + 7) + ',' + (p[1] - 8) + ' ' + (p[0] + 7) + ',' + (p[1] - 19) + ' ' + p[0] + ',' + (p[1] - 26) +
          ' C' + (p[0] - 7) + ',' + (p[1] - 19) + ' ' + (p[0] - 7) + ',' + (p[1] - 8) + ' ' + p[0] + ',' + p[1] + 'Z" fill="none" stroke="#c3bda9" stroke-width="1.6" stroke-dasharray="3 3"/>';
      });
      svg += '<text x="180" y="228" text-anchor="middle" font-size="12.5" fill="#8a8577">첫 책을 읽으면 잎이 돋아나요</text>';
    }

    var N = leaves.length;
    leaves.forEach(function (r, i) {
      var a = TREE_ANCHORS[i % TREE_ANCHORS.length];
      var ring = Math.floor(i / TREE_ANCHORS.length);
      var ang = (i * 137.5) * Math.PI / 180;
      var off = 6 + ring * 7;
      var x = a[0] + Math.cos(ang) * off;
      var y = a[1] + Math.sin(ang) * off * 0.8;
      var read = (r.logs || []).length > 0;
      var col = read ? bandColor(r.ar) : '#cfc9b8';
      var sz = (read ? 1.3 + Math.min(0.4, (r.logs.length - 1) * 0.12) : 0.95) * (N > 24 ? 0.8 : 1);
      var rot = ((i * 53) % 70) - 35 + (a[0] < 180 ? 12 : -12);
      var hgt = 20 * sz, sx = 6.2 * sz;
      svg += '<g data-leaf="' + r.id + '" transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') rotate(' + rot + ')" style="cursor:pointer">' +
        '<path d="M0,0 C' + sx.toFixed(1) + ',-' + (hgt * 0.34).toFixed(1) + ' ' + sx.toFixed(1) + ',-' + (hgt * 0.74).toFixed(1) + ' 0,-' + hgt.toFixed(1) +
        ' C-' + sx.toFixed(1) + ',-' + (hgt * 0.74).toFixed(1) + ' -' + sx.toFixed(1) + ',-' + (hgt * 0.34).toFixed(1) + ' 0,0Z" fill="' + col + '" opacity="' + (read ? 0.95 : 0.45) + '"/>' +
        '<path d="M0,-2 L0,-' + (hgt - 3).toFixed(1) + '" stroke="rgba(255,255,255,.5)" stroke-width=".9"/>' +
        '<circle r="12" fill="transparent"/></g>';
    });

    var fruitN = Math.min(Math.floor(total / 10), 12);
    for (var f = 0; f < fruitN; f++) {
      var fa = TREE_ANCHORS[(f * 5 + 3) % TREE_ANCHORS.length];
      var fx = fa[0] + (f % 2 ? 9 : -9), fy = fa[1] + 9;
      svg += '<g><circle cx="' + fx + '" cy="' + fy + '" r="6.6" fill="#e0913d"/>' +
        '<circle cx="' + (fx - 1.9) + '" cy="' + (fy - 2.1) + '" r="2.1" fill="#f8d0a4"/></g>';
    }
    svg += '</svg>';

    var h = '<div class="goalbar"><div class="row"><span>목표 <b>' + goal.toLocaleString() + '권</b>까지</span><span><b>' + total + '</b>권 (' + pct + '%)</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="chips" style="margin-top:9px" id="goalChips">' +
      [100, 300, 500, 1000].map(function (g) {
        return '<button class="chip ' + (goal === g ? 'is-on' : '') + '" data-goal="' + g + '">' + g.toLocaleString() + '권</button>';
      }).join('') + '</div></div>';
    h += '<div class="tree-wrap">' + svg + '</div>';
    h += '<div class="stat-grid">' +
      '<div class="stat"><b>' + total + '</b><span>누적 읽은 권수</span></div>' +
      '<div class="stat"><b>' + uniqueCount() + '</b><span>고유 권수</span></div>' +
      '<div class="stat"><b>' + Math.floor(total / 10) + '</b><span>열린 열매</span></div></div>';
    h += '<div class="legend">' +
      '<span><i class="dot" style="background:#4f86b8"></i>AR 0.5~1.9</span>' +
      '<span><i class="dot" style="background:#4f8a5f"></i>2.0~2.9</span>' +
      '<span><i class="dot" style="background:#b98a1f"></i>3.0~3.9</span>' +
      '<span><i class="dot" style="background:#a85f36"></i>4.0~4.9</span>' +
      '<span><i class="dot" style="background:#8a5b9e"></i>5.0+</span>' +
      '<span><i class="dot" style="background:#e0913d"></i>열매=10권</span></div>';
    h += '<p class="note">잎 하나가 읽은 책 한 권이에요. 잎을 누르면 그 책의 기록이 열립니다. 반복해서 읽은 횟수는 <b>누적 권수</b>에 함께 쌓여요.</p>';
    h += '<div class="section-title">지수별 분포</div>' + distHTML();
    return h;
  }
  function distHTML() {
    var d = bandDist();
    var rows = [
      ['a1', '0.5~1.9', d.a1], ['a2', '2.0~2.9', d.a2], ['a3', '3.0~3.9', d.a3],
      ['a4', '4.0~4.9', d.a4], ['a5', '5.0+', d.a5], ['none', '지수 없음', d.none]
    ];
    var max = Math.max(1, d.a1, d.a2, d.a3, d.a4, d.a5, d.none);
    return '<div>' + rows.map(function (r) {
      return '<div style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--muted)">' +
        '<span style="width:58px">' + r[1] + '</span>' +
        '<span style="flex:1;height:8px;background:#e8e2d3;border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:' + (r[2] / max * 100) + '%;background:' + BAND_COLOR[r[0]] + '"></i></span>' +
        '<b style="width:22px;text-align:right;color:#4c483e">' + r[2] + '</b></div>';
    }).join('') + '</div>';
  }

  /* =========================================================
     9. 시트(모달)
     ========================================================= */
  var sheet = document.getElementById('sheet');
  var backdrop = document.getElementById('backdrop');
  function openSheet(html) {
    sheet.innerHTML = '<div class="sheet-grab"></div><div class="sheet-in">' + html + '</div>';
    sheet.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(function () {
      sheet.classList.add('show'); backdrop.classList.add('show');
    });
    sheet.scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    sheet.classList.remove('show'); backdrop.classList.remove('show');
    setTimeout(function () { sheet.hidden = true; backdrop.hidden = true; sheet.innerHTML = ''; }, 230);
    document.body.style.overflow = '';
  }
  backdrop.addEventListener('click', closeSheet);

  /* ---------- 상세 ---------- */
  function openDetail(id) {
    var b = BOOKS.filter(function (x) { return x.id === id; })[0];
    if (!b) return;
    var rec = recOf(id);
    var acts = stageActs(b.j).concat(b.acts || []);
    var h = '';
    h += '<div style="display:flex;gap:13px;margin-bottom:6px">';
    h += coverHTML(b);
    h += '<div style="min-width:0;flex:1">';
    h += '<h3 id="sheetTitle">' + esc(b.title) + '</h3>';
    h += '<p class="kv" style="margin:0 0 6px">' + esc(b.author) + '</p>';
    h += '<div class="badges">' + fmtBadge(b.format) + '<span class="bd bd-ar">AR ' + b.ar.toFixed(1) + '</span>' +
      '<span class="bd bd-lex">' + lexLabel(b.lex) + '</span>' +
      '<span class="bd bd-j">' + J_INFO[b.j].short + '</span>' +
      '<span class="bd" style="background:#eee9dd;color:#5f5a4c">' + esc(b.il) + (b.pts ? ' · ' + b.pts.toFixed(1) + '점' : '') + '</span></div>';
    h += '</div></div>';
    h += '<p class="book-why" style="margin-top:10px">' + esc(b.why) + '</p>';
    h += '<div class="lib-card" style="padding:12px;margin-top:10px">';
    h += '<div class="lib-row"><span class="k">형태</span><span>' + (FMT_INFO[b.format] ? FMT_INFO[b.format].label : '—') + (b.series ? ' · ' + esc(b.series) : '') + '</span></div>';
    h += '<div class="lib-row"><span class="k">잠수네</span><span>' + J_INFO[b.j].name + '</span></div>';
    h += '<div class="lib-row"><span class="k">주제</span><span>' + esc(b.theme) + '</span></div>';
    h += '<div class="lib-row"><span class="k">출판</span><span>' + pubLine(b) + '</span></div>';
    h += '<div class="lib-row"><span class="k">ISBN</span><span>' + b.isbn + '</span></div>';
    h += '</div>';
    h += '<div class="section-title" style="margin-top:16px">듣기 · 읽기</div>';
    h += '<div class="linkrow">' +
      '<a class="btn primary" href="' + ytReadAloud(b) + '" target="_blank" rel="noopener">▶ 유튜브 Read Aloud</a>' +
      '<a class="btn" href="' + ytAudio(b) + '" target="_blank" rel="noopener">🎧 오디오북 찾기</a>' +
      '</div>';
    h += '<div class="linkrow">' +
      '<a class="btn sm" href="' + openLibLink(b) + '" target="_blank" rel="noopener">📖 Open Library</a>' +
      '<button class="btn sm" data-act="libFromBook" data-id="' + b.id + '">🏛 도서관 소장 확인</button>' +
      '</div>';
    h += '<div class="section-title">독후활동 제안 <span class="aside">J' + b.j + ' 기준</span></div>';
    h += '<ul class="acts">' + acts.map(function (a, i) {
      return '<li><input type="checkbox" data-detailact="' + i + '"><span>' + esc(a) + '</span></li>';
    }).join('') + '</ul>';
    h += '<div style="height:8px"></div>';
    h += '<button class="btn wide primary" data-act="record" data-id="' + b.id + '">독서기록 쓰기</button>';
    if (rec && rec.logs && rec.logs.length) {
      h += '<button class="btn wide" style="margin-top:8px" data-act="openRec" data-id="' + b.id + '">내 기록 보기 (' + rec.logs.length + '회)</button>';
    }
    h += '<button class="btn wide ghost" style="margin-top:8px" data-act="close">닫기</button>';
    openSheet(h);
  }

  function stageActs(j) { return (STAGE_ACTS[j] || STAGE_ACTS[3]).slice(); }
  function pubLine(b) {
    var parts = [];
    if (b.pub) parts.push(esc(b.pub));
    if (b.year) parts.push(b.year + '년');
    if (b.pages) parts.push(b.pages + 'p');
    return parts.length ? parts.join(' · ') : '—';
  }
  function fmtOf(id) {
    var b = BOOKS.filter(function (x) { return x.id === id; })[0];
    if (b) return b.format;
    var r = store.records[id];
    return r && r.format ? r.format : '';
  }

  /* ---------- 기록 작성 ---------- */
  var tmpRec = null;
  function openRecordForm(bookId, recId, logIndex) {
    var b, rec;
    if (bookId) {
      b = BOOKS.filter(function (x) { return x.id === bookId; })[0] || view.pending;
      tmpRec = store.records[b.id] || {
        id: b.id, title: b.title, author: b.author || '', isbn: b.isbn || '',
        ar: b.ar || 0, lex: b.lex || '', j: b.j || 0, theme: b.theme || '', format: b.format || '', series: b.series || '',
        why: b.why || '', acts: b.acts || [], src: b.src || 'catalog',
        cover: b.cover || '', emoji: b.emoji || '', logs: []
      };
      rec = tmpRec;
    } else {
      rec = store.records[recId];
      b = rec;
    }
    var log = (logIndex != null && rec.logs[logIndex]) ? rec.logs[logIndex] : {
      date: todayISO(), rating: 0, flow: false, focus: false, alone: false, aloud: false,
      repeats: 0, words: [], en: '', ko: '', audio: '', acts: {}
    };
    var acts = (b.acts && b.acts.length ? b.acts : []).concat(stageActs(b.j || 3));

    var h = '';
    h += '<h3 id="sheetTitle">' + esc(rec.title) + '</h3>';
    h += '<p class="kv" style="margin:0 0 2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap">' +
      fmtBadge(fmtOf(rec.id)) + '<span>' + (rec.ar ? 'AR ' + Number(rec.ar).toFixed(1) : 'AR —') + ' · ' + (rec.lex || 'Lexile —') + (rec.j ? ' · J' + rec.j : '') + '</span></p>';

    h += '<div class="field"><label>읽은 날짜</label><input type="date" id="fDate" value="' + (log.date || todayISO()) + '"></div>';

    h += '<div class="field"><label>별점</label><div class="stars" id="stars">' +
      [1, 2, 3, 4, 5].map(function (n) { return '<span data-star="' + n + '" class="' + (log.rating >= n ? 'on' : '') + '">★</span>'; }).join('') +
      '</div></div>';

    h += '<div class="field"><label>듣기 · 읽기 체크</label>' +
      checkRow('flow', '흘려듣기 (음원 틀어 두기)', log.flow) +
      checkRow('focus', '집중듣기 (음원·CD 들으며 읽기)', log.focus) +
      checkRow('aloud', '소리 내어 읽기', log.aloud) +
      checkRow('alone', '혼자 읽기', log.alone) +
      '</div>';

    h += '<div class="field"><label>반복해서 읽기</label>' +
      '<div class="counter"><button data-act="repMinus">−</button><b id="repVal">' + (log.repeats || 0) + '</b><button data-act="repPlus">+1</button>' +
      '<span class="kv" style="margin-left:6px">이번 기록에서 더 읽은 횟수</span></div>' +
      '<input type="hidden" id="fRepeats" value="' + (log.repeats || 0) + '"></div>';

    h += '<div class="field"><label>단어 · 표현 노트</label><div id="words">' +
      (log.words && log.words.length ? log.words.map(wordRow).join('') : wordRow({})) +
      '</div><button class="btn sm" data-act="addWord">+ 단어 추가</button>' +
      '<p class="hint">책에서 건진 단어와 짧은 표현을 적어 두면 나중에 복습 카드로 쓸 수 있어요.</p></div>';

    h += '<div class="field"><label>영어 한 줄</label>' +
      '<input id="fEn" placeholder="I like the part where Charlotte writes WORDS." value="' + esc(log.en) + '"></div>';
    h += '<div class="field"><label>줄거리 · 느낀 점 (한글)</label>' +

  var formTmp = { rating: 0, repeats: 0, flags: {}, acts: {} };
  function bindForm(rec, log, acts, logIndex) {
    formTmp.rating = log.rating || 0;
    formTmp.repeats = log.repeats || 0;
    formTmp.flags = { flow: !!log.flow, focus: !!log.focus, alone: !!log.alone, aloud: !!log.aloud };
    formTmp.acts = Object.assign({}, log.acts || {});

    var stars = document.getElementById('stars');
    if (stars) stars.addEventListener('click', function (e) {
      var s = e.target.closest('[data-star]');
      if (!s) return;
      formTmp.rating = parseInt(s.getAttribute('data-star'), 10);
      Array.prototype.forEach.call(stars.children, function (c) {
        c.classList.toggle('on', parseInt(c.getAttribute('data-star'), 10) <= formTmp.rating);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-flag]'), function (cb) {
      cb.addEventListener('change', function () {
        formTmp.flags[cb.getAttribute('data-flag')] = cb.checked;
        cb.closest('.check').classList.toggle('on', cb.checked);
      });
    });
  }

  function collectLog() {
    var words = [];
    Array.prototype.forEach.call(document.querySelectorAll('#words .word-row'), function (row) {
      var w = row.querySelector('.wWord').value.trim();
      var m = row.querySelector('.wMean').value.trim();
      if (w || m) words.push({ w: w, m: m });
    });
    var acts = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-actidx]'), function (cb) {
      if (cb.checked) acts[cb.getAttribute('data-actidx')] = true;
    });
    var g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
    return {
      date: g('fDate') || todayISO(),
      rating: formTmp.rating || 0,
      flow: !!formTmp.flags.flow, focus: !!formTmp.flags.focus,
      alone: !!formTmp.flags.alone, aloud: !!formTmp.flags.aloud,
      repeats: formTmp.repeats || 0,
      words: words, en: g('fEn').trim(), ko: g('fKo').trim(),
      memo: g('fMemo').trim(), audio: g('fAudio').trim(), acts: acts, at: new Date().toISOString()
    };
  }

      var blob = new Blob([data], { type: 'application/json' });

      a.href = URL.createObjectURL(blob);
      a.download = 'bookjaram-en-' + todayISO() + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast('파일로 저장했어요');

      copyText(data); toast('기록을 복사했어요');

  function importData() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          if (!d.records) throw 0;
          store.records = Object.assign(store.records, d.records);
          if (d.settings) store.settings = Object.assign(store.settings, d.settings);
          saveStore(); closeSheet(); renderShelf(); toast('기록을 가져왔어요');
        } catch (e) { toast('파일을 읽을 수 없어요'); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  /* =========================================================
     10. 정보나루
     ========================================================= */
  function parseNaru(text) {
    if (!text) return null;
    text = text.trim();
    if (text.charAt(0) === '{' || text.charAt(0) === '[') {
      try { return JSON.parse(text); } catch (e) { }
    }
    try {
      var doc = new DOMParser().parseFromString(text, 'text/xml');
      return doc;
    } catch (e) { return null; }
  }
  async function naruCheck() {
    var key = store.settings.naruKey;
    var isbnEl = document.getElementById('naruIsbn');
    var isbn = isbnEl ? isbnEl.value.replace(/[^0-9Xx]/g, '') : '';
    var out = document.getElementById('naruOut');
    if (!key) { toast('설정에서 인증키를 먼저 넣어 주세요'); return; }
    if (isbn.length < 10) { toast('ISBN을 넣어 주세요'); return; }
    out.innerHTML = '<div class="empty">양산 도서관 목록을 확인하는 중…</div>';
    try {
      var r = await fetch('https://data4library.kr/api/libSrch?authKey=' + encodeURIComponent(key) + '&format=json&libName=' + encodeURIComponent('양산'));
      var txt = await r.text();
      var data = parseNaru(txt);
      var libs = [];
      if (data && data.libraries) {
        (data.libraries || []).forEach(function (o) { if (o.lib) libs.push({ code: o.lib.libCode, name: o.lib.libName }); });
      } else if (data && data.getElementsByTagName) {
        var nodes = data.getElementsByTagName('lib');
        for (var i = 0; i < nodes.length; i++) {
          libs.push({ code: nodes[i].getElementsByTagName('libCode')[0].textContent, name: nodes[i].getElementsByTagName('libName')[0].textContent });
        }
      }
      if (!libs.length) {
        out.innerHTML = '<p class="kv">양산 지역 도서관을 찾지 못했어요. 인증키를 확인해 주세요.</p>' +
          '<a class="btn sm" target="_blank" rel="noopener" href="https://data4library.kr/api/libSrch?authKey=' + encodeURIComponent(key) + '&format=json&libName=' + encodeURIComponent('양산') + '">정보나루에서 직접 확인</a>';
        return;
      }
      var rows = [];
      for (var k = 0; k < Math.min(libs.length, 6); k++) {
        var l = libs[k];
        try {
          var r2 = await fetch('https://data4library.kr/api/bookExist?authKey=' + encodeURIComponent(key) + '&format=json&libCode=' + encodeURIComponent(l.code) + '&isbn13=' + isbn);
          var t2 = await r2.text();
          var d2 = parseNaru(t2);
          var has = false, cnt = '';
          if (d2 && d2.result) { has = String(d2.result.hasBook) === 'Y'; cnt = d2.result.loanAvailable || ''; }
          else if (d2 && d2.getElementsByTagName) {
            var res = d2.getElementsByTagName('result')[0];
            if (res) {
              has = (res.getElementsByTagName('hasBook')[0] || {}).textContent === 'Y';
              var la = res.getElementsByTagName('loanAvailable')[0];
              cnt = la ? la.textContent : '';
            }
          }
          rows.push('<div class="lib-row"><span class="k" style="width:auto;flex:1">' + esc(l.name) + '</span><b style="color:' + (has ? 'var(--green)' : 'var(--muted)') + '">' + (has ? '소장' : '미소장') + (cnt ? ' · ' + (cnt === 'Y' ? '대출가능' : '대출중') : '') + '</b></div>');
        } catch (e) {
          rows.push('<div class="lib-row"><span class="k" style="flex:1">' + esc(l.name) + '</span><span>확인 실패</span></div>');
        }
      }
      out.innerHTML = rows.join('');
    } catch (e) {
      out.innerHTML = '<p class="kv">브라우저에서 정보나루를 직접 부를 수 없어요(보안 제한). 아래 링크로 확인해 주세요.</p>' +
        '<a class="btn sm" target="_blank" rel="noopener" href="https://data4library.kr/api/bookExist?authKey=' + encodeURIComponent(key) + '&format=json&isbn13=' + isbn + '">정보나루에서 소장 조회</a>';
    }
  }

  document.querySelector('.tabbar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (b) switchTab(b.getAttribute('data-tab'));
  });
  function switchTab(tab) {
    view.tab = tab;
    ['books', 'library', 'scan', 'shelf'].forEach(function (t) {
      var sec = document.getElementById('tab-' + t);
      if (sec) sec.hidden = (t !== tab);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function (b) {
      var on = b.getAttribute('data-tab') === tab;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (tab === 'books') renderBooks();
    if (tab === 'library') renderLibrary();
    if (tab === 'scan') renderScan();
    if (tab === 'shelf') renderShelf();
    window.scrollTo({ top: 0 });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-mode],[data-dir],[data-band],[data-fmt],[data-j],[data-jump],[data-sv],[data-goal],[data-leaf]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    if (el.hasAttribute('data-mode')) { view.mode = el.getAttribute('data-mode'); view.band = 'all'; renderBooks(); return; }
    if (el.hasAttribute('data-dir')) { view.dir = parseInt(el.getAttribute('data-dir'), 10); renderBooks(); return; }
    if (el.hasAttribute('data-band')) { view.band = el.getAttribute('data-band'); renderBooks(); return; }
    if (el.hasAttribute('data-fmt')) { view.format = el.getAttribute('data-fmt'); renderBooks(); return; }
    if (el.hasAttribute('data-j')) { view.j = el.getAttribute('data-j'); renderBooks(); return; }
    if (el.hasAttribute('data-goal')) {
      store.settings.goal = parseInt(el.getAttribute('data-goal'), 10); saveStore(); renderShelf(); return;
    }
    if (el.hasAttribute('data-sv')) { view.shelfView = el.getAttribute('data-sv'); renderShelf(); return; }
    if (el.hasAttribute('data-jump')) { switchTab('shelf'); return; }
    if (el.hasAttribute('data-leaf')) { openRecDetail(el.getAttribute('data-leaf')); return; }

    switch (act) {
      case 'detail': openDetail(id); break;
      case 'record': openRecordForm(id || null, id, null); break;
      case 'openRec': openRecDetail(id); break;
      case 'close': closeSheet(); break;
      case 'openSettings': openSettings(); break;
      case 'saveSettings': saveSettings(); break;
      case 'exportData': exportData(); break;
      case 'importData': importData(); break;
      case 'resetAll': resetAll(); break;
      case 'copyq': {
        var q = libQuery();
        if (!q) { toast('복사할 제목을 먼저 넣어 주세요'); break; }
        toast(copyText(q) ? '“' + q.slice(0, 18) + '…” 복사했어요' : '복사하지 못했어요');
        break;
      }
      case 'libSearch': openLibSearch(); break;

      case 'libFromBook': {
        var bk = BOOKS.filter(function (x) { return x.id === id; })[0];
        closeSheet(); switchTab('library');
        setTimeout(function () {
          var inp = document.getElementById('libQ');
          if (inp) { inp.value = bk ? bk.title : ''; }
          toast('도서관에서 찾기를 눌러 주세요');
        }, 120);
        break;
      }
      case 'naruCheck': naruCheck(); break;
      case 'scanStart': startScan(); break;
      case 'scanStop': stopScan(); break;
      case 'isbnLookup': {
        var v = document.getElementById('isbnIn').value.replace(/[^0-9Xx]/g, '');
        if (v.length < 10) { toast('ISBN을 확인해 주세요'); break; }
        lookupISBN(v);
        break;
      }
      case 'manual': {
        var isbn = el.getAttribute('data-isbn') || (document.getElementById('isbnIn') ? document.getElementById('isbnIn').value.replace(/[^0-9Xx]/g, '') : '');
        openManualForm(isbn); break;
      }
      case 'addPending': {
        if (!view.pending) break;
        var pr = ensureRec(view.pending);
        toast('“' + pr.title.slice(0, 20) + '” 책장에 담았어요');
        view.pending = null;
        break;
      }
      case 'recordPending': {
        if (!view.pending) break;
        var b2 = view.pending;
        ensureRec(b2);
        openRecordForm(b2.id, b2.id, null);
        break;
      }
      case 'repPlus': {
        formTmp.repeats = Math.min(20, (formTmp.repeats || 0) + 1);
        document.getElementById('repVal').textContent = formTmp.repeats; break;
      }
      case 'repMinus': {
        formTmp.repeats = Math.max(0, (formTmp.repeats || 0) - 1);
        document.getElementById('repVal').textContent = formTmp.repeats; break;
      }
      case 'addWord': {
        var w = document.getElementById('words');
        var div = document.createElement('div');
        div.innerHTML = wordRow({});
        w.appendChild(div.firstChild);
        break;
      }
      case 'saveLog': {
        var rid = el.getAttribute('data-id');
        var li = el.getAttribute('data-log');
        var rec = store.records[rid];
        if (!rec && tmpRec && tmpRec.id === rid) { rec = tmpRec; store.records[rid] = rec; }
        if (!rec) break;
        var log = collectLog();
        if (li === '' || li == null) rec.logs.push(log);
        else rec.logs[parseInt(li, 10)] = log;
        rec.logs.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
        saveStore();
        closeSheet();
        toast('독서기록을 저장했어요');
        if (view.tab === 'shelf') renderShelf();
        if (view.tab === 'books') renderBooks();
        break;
      }
      case 'editLog': {
        var lid = el.getAttribute('data-id');
        openRecordForm(null, lid, parseInt(el.getAttribute('data-log'), 10));
        break;
      }
      case 'delLog': {
        var did = el.getAttribute('data-id');
        var di = parseInt(el.getAttribute('data-log'), 10);
        if (!confirm('이 기록을 삭제할까요?')) break;
        var r3 = store.records[did];
        r3.logs.splice(di, 1);
        saveStore(); closeSheet(); renderShelf(); toast('삭제했어요');
        break;
      }
    }
  });

  function openManualForm(isbn) {
    var h = '';
    h += '<h3 id="sheetTitle">직접 입력해서 담기</h3>';
    h += '<div class="field"><label>제목</label><input id="mTitle" placeholder="Book title"></div>';
    h += '<div class="field"><label>저자</label><input id="mAuthor" placeholder="Author"></div>';
    h += '<div class="field"><label>ISBN</label><input id="mIsbn" value="' + esc(isbn || '') + '"></div>';
    h += '<div class="field"><label>AR 지수 (모르면 비워 두세요)</label><input id="mAr" inputmode="decimal" placeholder="3.2"></div>';
    h += '<div class="field"><label>렉사일 지수 (예: 500L, AD350L, BR)</label><input id="mLex" placeholder="500L"></div>';
    h += '<button class="btn wide primary" data-act="saveManual">담기</button>';
    openSheet(h);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act="saveManual"]');
    if (!el) return;
    var t = document.getElementById('mTitle').value.trim();
    if (!t) { toast('제목을 넣어 주세요'); return; }
    var isbn = document.getElementById('mIsbn').value.replace(/[^0-9Xx]/g, '');
    var ar = parseFloat(document.getElementById('mAr').value) || 0;
    var lex = document.getElementById('mLex').value.trim().toUpperCase();
    var b = {
      id: isbn ? 'c' + isbn : 'c' + Date.now(), title: t,
      author: document.getElementById('mAuthor').value.trim(), isbn: isbn,
      ar: ar, lex: lex, j: ar ? (ar <= 0.9 ? 1 : ar <= 1.5 ? 2 : ar <= 2.5 ? 3 : ar <= 3.5 ? 4 : ar <= 4.5 ? 5 : ar <= 5.5 ? 6 : 7) : 0,
      theme: '', why: '', acts: [], src: 'custom', emoji: '📘'
    };
    ensureRec(b);
    closeSheet();
    toast('책장에 담았어요');
  });

  document.getElementById('btnSettings').addEventListener('click', openSettings);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* =========================================================
     12. 시작
     ========================================================= */
  renderBooks();
  window.__app = { view: view, store: store, renderBooks: renderBooks, renderShelf: renderShelf, switchTab: switchTab, openDetail: openDetail, openRecordForm: openRecordForm, BOOKS: BOOKS, FORMATS: FORMATS, FMT_INFO: FMT_INFO };
})();

</script>
</body>
</html>
